[pytest]
# Z-Brand-Core 统一测试入口配置（GAP-01）
# 规范用例 = 含 def test_ 的 test_*.py；纯脚本式由 tests/conftest.py 的
# pytest_ignore_collect 自动跳过（仍可用 python tests/xxx.py 手动运行，
# 或用 tests/run_all.py --scripts 以子进程分层执行，隔离真实平台/网络副作用）。
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q -p no:cacheprovider --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    online: 需要真实网络/平台/CDP 的用例（默认不跑，-m online 显式开启）
    slow: 较慢用例
    redline: 主体口径/时间口径/风险/事件/报告红线函数级用例
