name: Verify LUMENIS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development/test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources (BLOCKING)
        run: python -m compileall -q .

      - name: Validate CI test-tier manifests (BLOCKING)
        shell: bash
        run: |
          missing=0
          while IFS='|' read -r raw_path reason; do
            path="$(echo "$raw_path" | xargs)"
            [[ -z "$path" || "$path" == \#* ]] && continue
            if [[ ! -e "$path" ]]; then
              echo "Missing environment-tier path: $path"
              missing=1
            fi
          done < tests/ci_environment_tests.txt

          while IFS='|' read -r raw_node reason; do
            node="$(echo "$raw_node" | xargs)"
            [[ -z "$node" || "$node" == \#* ]] && continue
            file="${node%%::*}"
            if [[ ! -f "$file" ]]; then
              echo "Missing quarantined-node file: $file"
              missing=1
            fi
          done < tests/ci_quarantined_nodeids.txt
          exit "$missing"

      - name: Run clean-checkout hermetic pytest (BLOCKING)
        # Production/live suites remain required acceptance evidence, but are not
        # valid prerequisites for a secret-free clean checkout. See tests/CI_TEST_TIERS.md.
        shell: bash
        timeout-minutes: 15
        run: |
          ignore_args=()
          while IFS='|' read -r raw_path reason; do
            path="$(echo "$raw_path" | xargs)"
            [[ -z "$path" || "$path" == \#* ]] && continue
            ignore_args+=("--ignore=$path")
          done < tests/ci_environment_tests.txt

          deselect_args=()
          while IFS='|' read -r raw_node reason; do
            node="$(echo "$raw_node" | xargs)"
            [[ -z "$node" || "$node" == \#* ]] && continue
            deselect_args+=("--deselect=$node")
          done < tests/ci_quarantined_nodeids.txt

          python -m pytest tests/ \
            -m "not online" \
            "${ignore_args[@]}" \
            "${deselect_args[@]}" \
            -q --tb=line

      - name: Production/live and quarantine inventory (INFORMATIONAL)
        shell: bash
        run: |
          echo "=== Environment / Production-Live suites ==="
          cat tests/ci_environment_tests.txt
          echo "=== Exact quarantined nodeids ==="
          cat tests/ci_quarantined_nodeids.txt

      - name: Boundary Check (ADVISORY)
        continue-on-error: true
        run: python scripts/audit_tools/boundary_check.py --ci

      - name: Asset Impact Scan (INFORMATIONAL)
        continue-on-error: true
        run: python scripts/audit_tools/asset_impact_scan.py
