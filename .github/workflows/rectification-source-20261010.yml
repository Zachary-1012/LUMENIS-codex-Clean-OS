name: Rectification source snapshot 20261010

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rectification-source-20261010.yml']

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'Zachary-1012/LUMENIS-codex-Clean-OS' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6efc9ced81ef198f1617147d65e25b8349bebd69
          fetch-depth: 1
          persist-credentials: false
      - name: Export pinned tracked text without executing product code
        shell: bash
        run: |
          timeout 90s python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          expected = '6efc9ced81ef198f1617147d65e25b8349bebd69'
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=15).strip()
          if actual != expected:
              raise SystemExit('BASELINE_CHANGED')
          paths = subprocess.check_output(['git', 'ls-files', '-z'], timeout=15).decode('utf-8').split('\0')
          suffixes = {'.py', '.dart', '.json', '.md', '.yml', '.yaml', '.toml', '.ini', '.cfg', '.js', '.mjs', '.astro', '.ts', '.css', '.txt'}
          manifest = {'baseline': actual, 'scope': 'tracked text only; no runtime or DB', 'files': {}}
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rectification-source.zip'
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  path = pathlib.Path(name)
                  if not name or path.suffix.lower() not in suffixes or path.is_symlink() or not path.is_file():
                      continue
                  raw = path.read_bytes()
                  raw.decode('utf-8-sig')
                  archive.writestr(name, raw)
                  manifest['files'][name] = {'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)}
              archive.writestr('RECTIFICATION_SOURCE_MANIFEST.json', json.dumps(manifest, ensure_ascii=False, indent=2))
          print(json.dumps({'baseline': actual, 'files': len(manifest['files']), 'bytes': target.stat().st_size}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rectification-source-6efc9ced
          path: ${{ runner.temp }}/rectification-source.zip
          retention-days: 1
          if-no-files-found: error
