      - name: Test owner HTTP authorization with owned ephemeral listener (BLOCKING)
        timeout-minutes: 3
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          import os, pathlib, socket, tempfile
          root = pathlib.Path(tempfile.mkdtemp(prefix='oevira-owned-http-regression-'))
          for key in list(os.environ):
              if key.startswith(('ZBC_', 'TAIKOO_', 'XHS_', 'LUMENIS_', 'AI_', 'OPENAI_', 'ANTHROPIC_', 'ZHIPU_')):
                  os.environ.pop(key, None)
          os.environ.update(ZBC_DB_PATH=str(root/'seed.sqlite3'), ZBC_DATA_DIR=str(root),
              LUMENIS_TEST_SEED_DB=str(root/'seed.sqlite3'), ZBC_TEST_OFFLINE='1',
              XHS_PRODUCTION='0', ZBC_PREFLIGHT_ENFORCE='0', ZBC_GUARDIAN_ENABLED='0')
          import sqlite3
          from lumenis.shared.database import apply_business_schema
          connection = sqlite3.connect(root/'seed.sqlite3')
          try:
              apply_business_schema(connection)
              connection.commit()
          finally:
              connection.close()
          original_bind, original_connect = socket.socket.bind, socket.socket.connect
          owned_ports = set()
          def denied(*args, **kwargs):
              raise RuntimeError('ONLY_OWNED_EPHEMERAL_HTTP_FIXTURE_ALLOWED')
          def bind(sock, address):
              if not isinstance(address, tuple) or address[:2] != ('127.0.0.1', 0):
                  return denied()
              result = original_bind(sock, address)
              owned_ports.add(sock.getsockname()[1])
              return result
          def connect(sock, address):
              if not isinstance(address, tuple) or address[0] != '127.0.0.1' or address[1] not in owned_ports:
                  return denied()
              return original_connect(sock, address)
          socket.socket.bind, socket.socket.connect = bind, connect
          socket.socket.connect_ex = socket.socket.sendto = denied
          import pytest
          raise SystemExit(pytest.main(['-q', '--tb=short', '-p', 'no:cacheprovider',
