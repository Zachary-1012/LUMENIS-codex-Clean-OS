<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}广州太古汇舆情监测系统{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/architecture_dashboard.css">
    <link rel="stylesheet" href="/static/css/ui_optimized.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
    <link rel="stylesheet" href="/static/css/resident_health.css?v=5.9.9">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">广州太古汇舆情监测系统</h1>
                <span class="app-version">v5.9.9</span>
            </div>
            <div class="header-right">
                <div class="header-actions">
                    <button id="btn-refresh" class="btn btn-primary">一键更新</button>
                    <button id="btn-settings" class="btn btn-secondary">设置</button>
                </div>
                <!-- AGENTS §7.2 Auth Recovery 系统内可见徽章（0时隐藏） -->
                <span id="ar-badge" class="ar-badge hidden" title="存在需要人工处理的认证恢复任务">🔔 <span id="ar-count">0</span></span>
                <div class="user-info">
                    <span id="user-name">管理员</span>
                </div>
            </div>
        </header>

        <nav class="app-nav">
            <ul class="nav-list">
                <li class="nav-item active"><a href="/">仪表盘</a></li>
                <li class="nav-item"><a href="/notes">舆情笔记</a></li>
                <li class="nav-item"><a href="/events">舆情事件</a></li>
                <li class="nav-item"><a href="/reports">报告中心</a></li>
                <li class="nav-item"><a href="/brands">品牌业态</a></li>
                <li class="nav-item"><a href="/cases">案例库</a></li>
                <li class="nav-item"><a href="/negative">负面审核</a></li>
            </ul>
        </nav>

        <main class="app-main">
            {% block content %}{% endblock %}
        </main>

        <footer class="app-footer">
            <p>广州太古汇舆情监测系统 v5.9.9 | 数据更新时间: <span id="last-update">--</span></p>
        </footer>
    </div>

    <script src="/static/js/app.js?v=5.9.9"></script>
    <script src="/static/js/pr_case_integration.js?v=5.9.9"></script>
    <script src="/static/js/badge_manager.js?v=5.9.9"></script>
    <script src="/static/js/system_controls.js?v=5.9.9"></script>
    <script src="/static/js/system_features_ui.js?v=5.9.9"></script>
    <script src="/static/js/architecture_dashboard.js?v=5.9.9"></script>
    <script src="/static/js/frontend_enhancement.js?v=5.9.9"></script>
    <!-- AGENTS §7.2 Auth Recovery 系统内弹窗轮询（XSS 安全：纯 createElement + textContent） -->
    <script src="/static/js/auth_recovery_poller.js?v=5.9.9"></script>
    <script src="/static/js/resident_health.js?v=5.9.9"></script>
    <script>
      // Footer 数据更新时间戳（页面加载时立刻填入，避免一直显示 --）
      try { var lu = document.getElementById('last-update'); if (lu) lu.textContent = new Date().toLocaleString('zh-CN'); } catch(e) {}
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
