{% extends "base.html" %}
{% block title %}话题活动 · 序境 LUMENIS{% endblock %}
{% block page_title %}话题活动{% endblock %}

{% block content %}
<div class="lm-viewport" data-domain="cth">
  <div class="lm-viewport__context">
    <div class="lm-section-header" style="margin:0;">
      <div class="lm-section-header__title">话题活动</div>
    </div>
    <p class="lm-section-header__desc" style="color:var(--lm-color-text-secondary);margin:4px 0 0;">复用后端 API · 真实数据 · CTH保护域</p>
  </div>

  <!-- 时间范围切换 -->
  <div style="display:flex;gap:8px;margin:16px 0;align-items:center;">
    <span style="font-size:12px;color:var(--lm-color-text-secondary);">时间范围：</span>
    <button class="lm-btn lm-btn--ghost" style="font-size:12px;padding:4px 12px;" onclick="setRange('7d',this)">7天</button>
    <button class="lm-btn lm-btn--ghost" style="font-size:12px;padding:4px 12px;" onclick="setRange('30d',this)">30天</button>
    <button class="lm-btn lm-btn--ghost" style="font-size:12px;padding:4px 12px;" onclick="setRange('90d',this)">90天</button>
  </div>

  <!-- KPI 概览 -->
  <div id="kpi-row" class="lm-kpi-row" style="display:none;margin-bottom:16px;">
    <div class="lm-kpi-card"><div class="lm-kpi-card__label">总数</div><div class="lm-kpi-card__value" id="kpi-total">—</div></div>
    <div class="lm-kpi-card"><div class="lm-kpi-card__label">今日</div><div class="lm-kpi-card__value" id="kpi-today">—</div></div>
    <div class="lm-kpi-card"><div class="lm-kpi-card__label">正面</div><div class="lm-kpi-card__value" id="kpi-positive">—</div></div>
    <div class="lm-kpi-card"><div class="lm-kpi-card__label">负面</div><div class="lm-kpi-card__value" id="kpi-negative">—</div></div>
  </div>

  <!-- 主面板 -->
  <div class="lm-panel" id="main-panel" data-api="/api/topic-campaign/campaigns" data-state="loading">
    <div class="lm-panel__header">
      <span class="lm-panel__title">数据列表</span>
      <button class="lm-btn lm-btn--ghost" style="margin-left:auto;font-size:12px;" onclick="toggleRaw()">查看原始JSON</button>
    </div>
    <div class="lm-panel__body">
      <!-- 加载中 -->
      <div id="loading-panel" class="lm-state-panel">
        <div class="lm-loading-spinner"></div>
        <span>加载中…</span>
      </div>
      <!-- 空 -->
      <div id="empty-panel" class="lm-state-panel" style="display:none;">
        <span>暂无数据</span>
      </div>
      <!-- 错误 -->
      <div id="error-panel" class="lm-state-panel" style="display:none;">
        <span id="error-msg">加载失败</span>
        <button class="lm-btn lm-btn--ghost" style="margin-top:8px;" onclick="loadPanelData()">重试</button>
      </div>
      <!-- 成功 -->
      <div id="success-panel" style="display:none;">
        <div style="overflow-x:auto;">
          <table class="lm-data-table">
            <thead><tr id="table-head"></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
      <!-- 原始JSON -->
      <div id="raw-panel" style="display:none;margin-top:16px;">
        <pre id="raw-json-content" style="background:var(--lm-color-bg-secondary);padding:12px;border-radius:8px;font-size:11px;overflow:auto;max-height:400px;white-space:pre-wrap;"></pre>
      </div>
    </div>
  </div>
</div>

<script>
const LIST_KEYS = ["brands", "items", "list", "results", "notes", "events", "campaigns", "data", "series"];
let currentRange = '30d';
let rawData = null;

function setRange(range, btn) {
  currentRange = range;
  document.querySelectorAll('.lm-btn--ghost').forEach(b => b.classList.remove('is-active'));
  if (btn) btn.classList.add('is-active');
  loadPanelData();
}

function setState(state) {
  const panel = document.getElementById('main-panel');
  panel.dataset.state = state;
  document.getElementById('loading-panel').style.display = state === 'loading' ? 'flex' : 'none';
  document.getElementById('empty-panel').style.display = state === 'empty' ? 'flex' : 'none';
  document.getElementById('error-panel').style.display = state === 'error' ? 'flex' : 'none';
  document.getElementById('success-panel').style.display = state === 'success' ? 'block' : 'none';
}

function extractList(data) {
  if (Array.isArray(data)) return data;
  for (const key of LIST_KEYS) {
    if (data[key] && Array.isArray(data[key])) return data[key];
  }
  // 尝试找第一个数组值
  for (const k in data) {
    if (Array.isArray(data[k])) return data[k];
  }
  return [];
}

function inferColumns(list) {
  if (!list.length) return [];
  const priority = ['id','note_id','case_id','campaign_id','brand_name','name','title','author_nickname','author','category','type','sentiment','risk_level','likes','comments','collects','shares','publish_datetime','created_at','date','captured_at','description','summary','content'];
  const allKeys = new Set();
  list.slice(0, 20).forEach(item => {
    if (item && typeof item === 'object') Object.keys(item).forEach(k => allKeys.add(k));
  });
  const cols = priority.filter(k => allKeys.has(k));
  allKeys.forEach(k => { if (!cols.includes(k)) cols.push(k); });
  return cols.slice(0, 12);
}

function renderTable(list) {
  const cols = inferColumns(list);
  const head = document.getElementById('table-head');
  const body = document.getElementById('table-body');
  head.innerHTML = cols.map(c => `<th>${c}</th>`).join('');
  body.innerHTML = list.slice(0, 100).map(item => {
    return '<tr>' + cols.map(c => {
      let val = item ? item[c] : '';
      if (val === null || val === undefined) val = '';
      if (typeof val === 'object') val = JSON.stringify(val);
      return `<td>${String(val).slice(0, 80)}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

function renderKPI(list, data) {
  document.getElementById('kpi-row').style.display = 'flex';
  document.getElementById('kpi-total').textContent = list.length || data.count || data.total || '—';
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = list.filter(item => {
    const d = item.publish_datetime || item.created_at || item.date || item.captured_at || '';
    return String(d).startsWith(today) || String(d).includes(today.slice(5));
  }).length;
  document.getElementById('kpi-today').textContent = todayCount || '—';
  const pos = list.filter(item => {
    const s = (item.sentiment || item.emotion || item.polarity || '').toString().toLowerCase();
    return s.includes('pos') || s.includes('正面');
  }).length;
  const neg = list.filter(item => {
    const s = (item.sentiment || item.emotion || item.polarity || '').toString().toLowerCase();
    return s.includes('neg') || s.includes('负面');
  }).length;
  document.getElementById('kpi-positive').textContent = pos || '—';
  document.getElementById('kpi-negative').textContent = neg || '—';
}

function toggleRaw() {
  const p = document.getElementById('raw-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

async function loadPanelData() {
  setState('loading');
  const api = document.getElementById('main-panel').dataset.api;
  const sep = api.includes('?') ? '&' : '?';
  const url = `${api}${sep}range=${currentRange}`;
  try {
    const res = await LUMENIS.fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    rawData = data;
    document.getElementById('raw-json-content').textContent = JSON.stringify(data, null, 2).slice(0, 10000);
    const list = extractList(data);
    if (!list.length) {
      setState('empty');
      renderKPI([], data);
      return;
    }
    renderKPI(list, data);
    renderTable(list);
    setState('success');
  } catch (e) {
    document.getElementById('error-msg').textContent = e.message;
    setState('error');
  }
}

// 等待 LUMENIS 初始化
function _waitForLUMENIS(cb) {
  if (window.LUMENIS && window.LUMENIS.fetch) cb();
  else setTimeout(() => _waitForLUMENIS(cb), 50);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => _waitForLUMENIS(loadPanelData));
} else {
  _waitForLUMENIS(loadPanelData);
}
</script>
{% endblock %}
