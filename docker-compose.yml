# =====================================================================
# Z-Brand Core / CTH-POMS  -  production-shaped compose template
# ---------------------------------------------------------------------
# State (SQLite + logs) lives on named volumes, never inside the image.
# Browser-backed collection uses a separately managed remote Worker endpoint
# (XHS_CDP_URL / DOUYIN_CDP_URL); no developer-local browser is used.
# Bring up:        docker compose up -d
# Staging overlay: docker compose -f docker-compose.yml \
#                  -f docker-compose.staging.yml up -d
# =====================================================================
services:
  zbc:
    build: .
    image: zbrand-core:latest
    container_name: zbc-prod
    # Loopback is the default. A non-loopback bind is explicit config, not public-use authorization.
    ports:
      - "${LUMENIS_DOCKER_BIND_IP:-127.0.0.1}:8201:8201"
    environment:
      - TAIKOO_HOST=0.0.0.0
      - TAIKOO_PORT=8201
      - ZB_WSGI=waitress
      - ZBC_DB_PATH=/app/data/monitor.db
      - ZBC_DATA_DIR=/app/data
      - XHS_CDP_URL=${XHS_CDP_URL:-}
      - DOUYIN_CDP_URL=${DOUYIN_CDP_URL:-}
    # .env is git-ignored and machine-local; optional so a fresh clone can still boot.
    env_file:
      - path: .env
        required: false
    volumes:
      - zbc-data:/app/data
      - zbc-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8201/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  zbc-data:
  zbc-logs:
