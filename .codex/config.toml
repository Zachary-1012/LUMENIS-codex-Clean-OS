# Preserve the complete LUMENIS execution router. Codex applies this as a shared project-instruction budget; keep headroom above the current root AGENTS.md so current rules cannot be silently truncated.
project_doc_max_bytes = 131072
# LUMENIS / 序境 — repository-local Codex execution layer.
# This file configures engineering behavior only. It is not Product Truth.
# Primary-window model choice follows AGENTS/model-routing; any Product Owner manual window selection wins.
# Only the approved task-subagent fallback is encoded natively here.
sandbox_mode = "danger-full-access"
approval_policy = "never"
web_search = "live"

[features]
hooks = true
multi_agent = true
shell_snapshot = true
goals = true
skill_search = true

[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60
