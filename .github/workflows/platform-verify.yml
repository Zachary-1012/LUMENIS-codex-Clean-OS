              'tests/test_root_owner_auth_composition.py',
              'tests/test_scoped_topic_labels.py',
              'tests/test_ai.py', 'tests/test_intelligence_boundary_audit.py',
              'tests/test_boundary_review_source_identity.py',
              'tests/test_mcp_contract_review.py', 'tests/test_mcp_package_byte_binding.py',
              'tests/test_mcp_protocol_contract.py',
              'tests/test_csv_dialect_real_inputs.py',
              # CPython 3.11 worker-entry matrix: real local processes only,
              # no network/model/training. Full affected recovery runs are
              # separately recorded on the frozen source with synthetic DBs.
              'tests/test_owned_training_runtime_recovery.py::test_source_pinned_managed_worker_has_actual_private_peer_and_stop_replacement',
              'tests/test_owned_training_runtime_recovery.py::test_unbound_invocation_reaps_real_managed_worker_without_waiting',
              'tests/test_owned_training_runtime_recovery.py::test_managed_worker_preserves_private_venv_for_start_replace_and_reap',
              'tests/test_owned_training_runtime_recovery.py::test_managed_worker_rejects_invalid_interpreter_before_spawn',
              'tests/test_owned_training_runtime_recovery.py::test_managed_worker_rejects_identity_or_entry_change_and_reaps'], plugins=[FailureLog()]))
          PY

