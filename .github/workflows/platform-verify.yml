name: Verify LUMENIS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development/test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources (BLOCKING)
        # Syntax errors are repository blockers.
        run: python -m compileall -q .

      - name: Validate CI test-tier manifest (BLOCKING)
        shell: bash
        run: |
          missing=0
          while IFS='|' read -r raw_path reason; do
            path="$(echo "$raw_path" | xargs)"
            [[ -z "$path" || "$path" == \#* ]] && continue
            if [[ ! -e "$path" ]]; then
              echo "Missing test-tier path: $path"
              missing=1
            fi
          done < tests/ci_environment_tests.txt
          exit "$missing"

      - name: Run clean-checkout hermetic pytest (BLOCKING)
        # Environment/live suites remain required acceptance evidence but are not
        # valid clean-checkout tests. See tests/CI_TEST_TIERS.md.
        shell: bash
        timeout-minutes: 15
        run: |
          ignore_args=()
          while IFS='|' read -r raw_path reason; do
            path="$(echo "$raw_path" | xargs)"
            [[ -z "$path" || "$path" == \#* ]] && continue
            ignore_args+=("--ignore=$path")
          done < tests/ci_environment_tests.txt

          python -m pytest tests/ \
            -m "not online" \
            "${ignore_args[@]}" \
            -q --tb=line

      - name: Production/live gate inventory (INFORMATIONAL)
        run: cat tests/ci_environment_tests.txt

      - name: Boundary Check (ADVISORY)
        # Governance signal until violations are classified into explicit blocking/advisory policy.
        continue-on-error: true
        run: python scripts/audit_tools/boundary_check.py --ci

      - name: Asset Impact Scan (INFORMATIONAL)
        # Repository inventory signal; failure is reported but does not currently block release.
        continue-on-error: true
        run: python scripts/audit_tools/asset_impact_scan.py
