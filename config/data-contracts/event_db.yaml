# 事件存量兼容契约（DB events 无 event_type 列；供 quality_audit 审计使用）
contract:
  name: event_db
  version: "1.0"
  owner: "ZBC Event Engine (audit)"
  status: active
  rules:
    - name: risk_level_valid
      type: allowed_values
      field: risk_level
      allowed_values: [low, medium, high, critical, unconfirmed]
      severity: error
    - name: event_time_format
      type: date_format
      field: event_date
      format: ["%Y-%m-%d", "%Y-%m-%d %H:%M:%S"]
      severity: warning
