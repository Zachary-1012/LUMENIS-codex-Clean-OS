name: LUMENIS App Gate

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".env.example"
      - "app.py"
      - "config.py"
      - "contracts/experience/**"
      - "AGENTS.md"
      - "README.md"
      - "00-GOVERNANCE/AI-NATIVE-PRODUCT-CONSTITUTION.md"
      - "00-GOVERNANCE/LUMENIS-PRODUCT-ARCHITECTURE-CURRENT.md"
      - "00-GOVERNANCE/LUMENIS-EXPERIENCE-CONSTITUTION.md"
      - "00-GOVERNANCE/LUMENIS-MULTI-SURFACE-DECISION-CURRENT.md"
      - "scripts/audit_tools/verify_ai_native_constitution.py"
      - "scripts/audit_tools/verify_current_configuration.py"
      - "scripts/audit_tools/verify_experience_*.py"
      - ".github/workflows/app-verify.yml"
  # Required branch-protection job: always run on main PRs, including backend/docs changes.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-packaging:
    name: Windows packaging contracts
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install manifest parser from product requirements
        shell: pwsh
        run: |
          $yamlRequirement = Get-Content requirements.txt | Where-Object { $_ -match '^PyYAML[<=>]' }
          if (-not $yamlRequirement) { throw 'PyYAML requirement is missing' }
          python -m pip install $yamlRequirement
      - name: Verify Windows packaging and build identity (BLOCKING)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s app/tool -p test_build_windows.py -v

  verify-app:
    name: Flutter application foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout LUMENIS
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate AI-native product constitution execution chain (BLOCKING)
        run: python3 scripts/audit_tools/verify_ai_native_constitution.py

      - name: Validate current configuration and Flutter toolchain (BLOCKING)
        run: python3 scripts/audit_tools/verify_current_configuration.py

      - name: Validate multi-surface Experience authority (BLOCKING)
        shell: bash
        run: |
          python3 scripts/audit_tools/verify_experience_authority_exclusive.py
          python3 scripts/audit_tools/verify_experience_anti_template.py --strict
          python3 scripts/audit_tools/verify_experience_screen_blueprints.py

      - name: Validate approved frontend source state (BLOCKING)
        id: frontend
        run: python3 scripts/audit_tools/experience_gate_mode.py --source-state --github-output "$GITHUB_OUTPUT"

      - name: Require complete frontend for product release (BLOCKING)
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/audit_tools/experience_gate_mode.py --require-product

      - name: Install pinned Flutter stable (EXECUTION-LAYER)
        shell: bash
        run: |
          flutter_version="$(python3 -c "import json; print(json.load(open('app/toolchain.json', encoding='utf-8'))['flutter_version'])")"
          test -n "$flutter_version"
          rm -rf "$RUNNER_TEMP/flutter"
          ok=0
          for attempt in 1 2 3; do
            if git clone --depth 1 --branch "$flutter_version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"; then
              ok=1
              break
            fi
            echo "Flutter SDK fetch attempt $attempt failed; retrying..."
            rm -rf "$RUNNER_TEMP/flutter"
            sleep 8
          done
          test "$ok" -eq 1
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter environment
        shell: bash
        run: |
          flutter config --no-analytics
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          dart --version
          python3 - <<'PY'
          import json, os
          expected = json.load(open('app/toolchain.json', encoding='utf-8'))
          actual = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'flutter-version.json'), encoding='utf-8'))
          assert actual['frameworkVersion'] == expected['flutter_version'], (actual, expected)
          assert actual['frameworkRevision'] == expected['flutter_revision'], (actual, expected)
          assert actual['dartSdkVersion'] == expected['dart_version'], (actual, expected)
          # The gate installs the exact tag/revision, so a detached checkout can
          # report "[user-branch]" instead of "stable". Exact version, revision
          # and Dart identity remain the stronger pin; accept only that alias.
          actual_channel = str(actual.get('channel', ''))
          assert actual_channel in {str(expected['channel']), '[user-branch]'}, (actual, expected)
          PY

      - name: Resolve app dependencies (EXECUTION-LAYER)
        working-directory: app
        shell: bash
        run: |
          ok=0
          for attempt in 1 2 3; do
            if flutter pub get --enforce-lockfile; then
              ok=1
              break
            fi
            echo "flutter pub get attempt $attempt failed; retrying..."
            sleep 8
          done
          test "$ok" -eq 1

      - name: Analyze canonical app
        if: steps.frontend.outputs.state == 'ACTIVE'
        working-directory: app
        run: flutter analyze

      - name: Test reviewed UI and saved-work regressions (BLOCKING)
        if: steps.frontend.outputs.state == 'ACTIVE'
        working-directory: app
        run: |
          flutter test --no-pub \
            test/features/system/sys_waiting_feedback_test.dart \
            test/features/system/sys06_reader_test.dart \
            test/features/system/sys06_page_context_test.dart \
            test/features/system/sys06_frame_stream_test.dart \
            test/features/bmp08/bmp08_saved_work_test.dart \
            test/features/bmp08/bmp08_saved_editor_widget_test.dart \
            test/features/bmp04/bmp04_classification_test.dart \
            test/features/bmp04/bmp04_screen_test.dart \
            test/features/bmp03/bmp03_screen_test.dart \
            test/core/lumenis_core_client_test.dart \
            test/core/lumenis_theme_test.dart \
            test/shell/lumenis_workspace_shell_test.dart \
            test/features/bmp01/bmp01_screen_test.dart \
            test/features/cth/cth01/cth01_screen_test.dart \
            test/features/cth/cth10/cth10_repository_test.dart \
            test/features/cth/cth10/cth10_screen_test.dart \
            test/core/source_brief_client_test.dart \
            test/core/internal_pitch_client_test.dart \
            test/core/ai_conversation_client_test.dart \
            test/features/ai01/ai01_screen_test.dart \
            test/features/ai01/ai01_conversations_test.dart \
            test/features/ai01/ai01_view_model_test.dart \
            test/features/ai01/ai01_draft_actions_test.dart \
            test/features/ai01/ai01_workspace_draft_test.dart \
            test/features/cth/cth10/source_brief_view_model_test.dart \
            test/features/cth/cth10/source_brief_panel_test.dart \
            test/features/cth/cth10/business_work_panel_test.dart \
            test/features/account/acc02/acc02_registration_test.dart \
            test/features/system/sys05_subject_directory_test.dart \
            test/features/cth/cth10/source_brief_domain_import_test.dart \
            test/features/shared/sh02/sh02_office_controller_test.dart \
            test/features/shared/sh02/sh02_office_screen_test.dart \
            test/features/shared/sh02/sh02_screen_test.dart \
            test/navigation/lumenis_router_test.dart \
            test/features/shared/sh01/manuscript_controller_test.dart \
            test/features/shared/sh01/manuscript_draft_files_test.dart \
            test/features/shared/sh01/manuscript_editor_test.dart \
            test/features/shared/sh01/media_project_controller_test.dart \
            test/features/shared/sh01/media_project_snapshot_test.dart \
            test/features/shared/sh01/media_project_workbench_test.dart \
            test/features/shared/sh01/native_media_cache_test.dart \
            test/features/shared/sh01/native_media_preview_controller_test.dart \
            test/features/shared/read_aloud_service_test.dart \
            test/features/shared/pr83_observation_presentation_test.dart \
            test/features/bmp09/bmp09_artifact_display_test.dart \
            test/features/shared/sh01/sh01_screen_test.dart \
            test/features/shared/sh04/sh04_screen_test.dart \
            test/features/shared/sh04/sh04_view_model_race_test.dart

      - name: Test browser contracts (BLOCKING)
        if: steps.frontend.outputs.state == 'ACTIVE'
        working-directory: app
        run: |
          flutter test --no-pub --platform chrome \
            test/core/lumenis_http_transport_web_test.dart \
            test/lumenis_core_web_origin_test.dart \
            test/features/shared/sh01/media_preview_web_test.dart

      - name: Build real Web Workspace (BLOCKING)
        if: steps.frontend.outputs.state == 'ACTIVE'
        working-directory: app
        run: flutter build web --release

      - name: Analyze retained nonvisual source (BLOCKING)
        if: steps.frontend.outputs.state == 'REMOVED_PENDING_REBUILD'
        working-directory: app
        run: flutter analyze lib

      - name: Test retained product clients and data contracts (BLOCKING)
        if: steps.frontend.outputs.state == 'REMOVED_PENDING_REBUILD'
        working-directory: app
        run: |
          flutter test --no-pub \
            test/core/lumenis_core_client_test.dart \
            test/core/internal_pitch_client_test.dart \
            test/core/ai_conversation_client_test.dart \
            test/features/ai01/ai01_view_model_test.dart \
            test/features/ai01/ai01_workspace_draft_test.dart \
            test/features/cth/cth10/source_brief_view_model_test.dart \
            test/features/shared/sh01/manuscript_controller_test.dart \
            test/features/shared/sh01/manuscript_draft_files_test.dart \
            test/features/shared/sh01/media_project_controller_test.dart \
            test/features/shared/sh01/native_media_cache_test.dart \
            test/features/shared/sh01/native_media_preview_controller_test.dart
          flutter test --no-pub --platform chrome \
            test/core/lumenis_http_transport_web_test.dart \
            test/lumenis_core_web_origin_test.dart

      - name: Record frontend acceptance boundary
        if: always()
        run: |
          echo 'Source retirement does not pass a Flutter build, UI acceptance or product release.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Removed presentation tests remain historical and unexecuted until a complete new frontend is available.' >> "$GITHUB_STEP_SUMMARY"
