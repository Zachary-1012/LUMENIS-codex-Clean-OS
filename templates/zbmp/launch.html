<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>序境 · ZBMP 品牌智能</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
      background: linear-gradient(135deg, #064e3b 0%, #0F766E 50%, #14B8A6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(255,255,255,0.05) 0%, transparent 50%);
    }
    .launch-container {
      text-align: center;
      z-index: 1;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      animation: launch-in 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes launch-in {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: none; }
    }
    .launch-logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .launch-product {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .launch-subtitle {
      font-size: 14px;
      opacity: 0.75;
      font-weight: 400;
      margin-bottom: 40px;
    }
    .launch-progress-wrap {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 20px;
    }
    .launch-progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .launch-progress-fill {
      height: 100%;
      background: #fff;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 12px rgba(255,255,255,0.5);
    }
    .launch-progress-text {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
    }
    .launch-version {
      font-size: 11px;
      opacity: 0.4;
      margin-top: 32px;
      font-family: 'JetBrains Mono', monospace;
    }
    .launch-enter {
      margin-top: 24px;
      padding: 12px 32px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      backdrop-filter: blur(10px);
      opacity: 0;
      animation: fade-in 0.4s ease 2.2s forwards;
    }
    .launch-enter:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-1px);
    }
    @keyframes fade-in { to { opacity: 1; } }
    .launch-features {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-top: 36px;
      opacity: 0;
      animation: fade-in 0.5s ease 0.6s forwards;
    }
    .launch-feature {
      text-align: center;
    }
    .launch-feature-icon {
      font-size: 20px;
      margin-bottom: 6px;
      opacity: 0.8;
    }
    .launch-feature-label {
      font-size: 10px;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    @media (max-width: 480px) {
      .launch-product { font-size: 22px; }
      .launch-logo { width: 60px; height: 60px; font-size: 26px; border-radius: 16px; }
      .launch-features { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="launch-container">
    <div class="launch-logo">序</div>
    <h1 class="launch-product">序境 · 品牌智能</h1>
    <p class="launch-subtitle">ZBMP · Brand Intelligence & Content Marketing</p>

    <div class="launch-features">
      <div class="launch-feature">
        <div class="launch-feature-icon">▣</div>
        <div class="launch-feature-label">Brand</div>
      </div>
      <div class="launch-feature">
        <div class="launch-feature-icon">✎</div>
        <div class="launch-feature-label">Content</div>
      </div>
      <div class="launch-feature">
        <div class="launch-feature-icon">⇄</div>
        <div class="launch-feature-label">Competition</div>
      </div>
    </div>

    <div class="launch-progress-wrap" style="margin-top:40px">
      <div class="launch-progress-bar">
        <div class="launch-progress-fill" id="progressFill"></div>
      </div>
      <div class="launch-progress-text" id="progressText">初始化系统…</div>
    </div>

    <button class="launch-enter" onclick="enterApp()">进入系统 →</button>
    <div class="launch-version">LUMENIS v5.9.9 · ZBMP Domain</div>
  </div>

  <script>
    var steps = [
      { p: 20, t: '初始化系统…' },
      { p: 45, t: '连接品牌库…' },
      { p: 70, t: '加载内容数据…' },
      { p: 90, t: '准备工作台…' },
      { p: 100, t: '就绪' }
    ];
    var idx = 0;
    var fill = document.getElementById('progressFill');
    var text = document.getElementById('progressText');
    function nextStep() {
      if (idx >= steps.length) {
        setTimeout(enterApp, 600);
        return;
      }
      fill.style.width = steps[idx].p + '%';
      text.textContent = steps[idx].t;
      idx++;
      setTimeout(nextStep, 450);
    }
    function enterApp() {
      window.location.href = '/lumenis/zbmp/overview';
    }
    setTimeout(nextStep, 400);
  </script>
</body>
</html>
