<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zachary Robot · 精致版</title>
<style>
  body {
    margin: 0;
    padding: 60px 20px;
    background: radial-gradient(ellipse at 50% 30%, #1e1b4b 0%, #0f0d24 40%, #050510 100%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .title {
    font-size: 13px;
    letter-spacing: 4px;
    opacity: 0.4;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: 11px;
    opacity: 0.25;
    margin-bottom: 40px;
  }
  .hint {
    margin-top: 50px;
    font-size: 11px;
    opacity: 0.3;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="title">CTH-POMS</div>
  <div class="subtitle">Zachary · Intelligent Monitor</div>

  <div id="robotMount"></div>

  <div class="hint">拖动 · 点击进入 · 呼吸光晕 · 表情切换</div>

<script>
const ZacharyRobot = (function() {
  const CONFIG = {
    mountId: "robotMount",
    imgOpen:  "https://aka.doubaocdn.com/s/iJQsX7ulS2",
    imgClose: "https://aka.doubaocdn.com/s/0MGglAkBej",
    onClickJumpUrl: "/overview",
    robotSize: 200,
    containerW: 320,
    containerH: 360,
    expressionInterval: 3200,
    starCount: 42,
    dragBoundaryX: 95,
    dragBoundaryY: 105,
    // 光晕颜色
    glowPurple: "184,107,255",
    glowCyan: "100,220,255",
    glowGreen: "57,255,136"
  };

  let mountEl, wrapEl, robotEl, imgEl, glowEl, baseEl, ringEl, starCanvas, starCtx;
  let stars = [], currentExpression = "open";
  let drag = { active:false, ox:0, oy:0, rx:0, ry:0, moved:false };
  let time = 0, animationId = null, expressionTimer = null;
  let imgOpacity = 1, targetImgOpacity = 1;

  function waitMount(cb) {
    const el = document.getElementById(CONFIG.mountId);
    if (!el) { setTimeout(() => waitMount(cb), 100); return; }
    mountEl = el; cb();
  }

  function buildDom() {
    // 容器
    wrapEl = document.createElement("div");
    wrapEl.style.cssText = `
      width:${CONFIG.containerW}px;height:${CONFIG.containerH}px;
      position:relative;margin:0 auto;overflow:hidden;
      touch-action:none;user-select:none;-webkit-user-select:none;
    `;

    // 星星画布（底层）
    starCanvas = document.createElement("canvas");
    starCanvas.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:1;";
    starCanvas.width = CONFIG.containerW;
    starCanvas.height = CONFIG.containerH;
    starCtx = starCanvas.getContext("2d");

    // 呼吸光晕（机器人背后）
    glowEl = document.createElement("div");
    glowEl.style.cssText = `
      position:absolute;left:50%;top:42%;
      width:${CONFIG.robotSize * 1.6}px;height:${CONFIG.robotSize * 1.6}px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:radial-gradient(circle, rgba(${CONFIG.glowPurple},0.25) 0%, rgba(${CONFIG.glowCyan},0.08) 40%, transparent 70%);
      filter:blur(20px);
      pointer-events:none;z-index:2;
    `;

    // 玻璃拟态能量底座
    baseEl = document.createElement("div");
    baseEl.style.cssText = `
      position:absolute;left:50%;bottom:30px;
      width:${CONFIG.robotSize * 0.9}px;height:18px;
      transform:translateX(-50%);
      border-radius:50%;
      background:radial-gradient(ellipse, rgba(${CONFIG.glowPurple},0.3) 0%, rgba(${CONFIG.glowCyan},0.1) 50%, transparent 70%);
      filter:blur(6px);
      pointer-events:none;z-index:2;
    `;

    // 旋转光环
    ringEl = document.createElement("div");
    ringEl.style.cssText = `
      position:absolute;left:50%;top:44%;
      width:${CONFIG.robotSize * 1.35}px;height:${CONFIG.robotSize * 1.35}px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      border:1px solid rgba(${CONFIG.glowPurple},0.15);
      pointer-events:none;z-index:2;
    `;
    // 光环上的光点
    const ringDot = document.createElement("div");
    ringDot.style.cssText = `
      position:absolute;top:-2px;left:50%;
      width:4px;height:4px;border-radius:50%;
      background:rgba(${CONFIG.glowCyan},0.8);
      box-shadow:0 0 8px rgba(${CONFIG.glowCyan},0.8);
      transform:translateX(-50%);
    `;
    ringEl.appendChild(ringDot);

    // 机器人容器
    robotEl = document.createElement("div");
    robotEl.style.cssText = `
      width:${CONFIG.robotSize}px;height:${CONFIG.robotSize}px;
      position:absolute;left:50%;top:42%;
      transform:translate(-50%,-50%);
      cursor:grab;z-index:3;
      transition:transform 0.15s ease-out;
    `;

    // 机器人图片
    imgEl = document.createElement("img");
    imgEl.src = CONFIG.imgOpen;
    imgEl.style.cssText = `
      width:100%;height:100%;object-fit:contain;display:block;
      pointer-events:none;-webkit-user-drag:none;
      filter: drop-shadow(0 4px 20px rgba(${CONFIG.glowPurple},0.3))
              drop-shadow(0 0 30px rgba(${CONFIG.glowCyan},0.15));
      transition: opacity 0.4s ease;
    `;

    // 预加载
    [CONFIG.imgOpen, CONFIG.imgClose].forEach(src => { const i=new Image(); i.src=src; });

    robotEl.appendChild(imgEl);
    wrapEl.appendChild(starCanvas);
    wrapEl.appendChild(glowEl);
    wrapEl.appendChild(baseEl);
    wrapEl.appendChild(ringEl);
    wrapEl.appendChild(robotEl);
    mountEl.appendChild(wrapEl);

    initStars();
    bindEvents();
    startExpression();
    animate();

    console.log("%c[ZacharyRobot] 精致版加载完成 ✨", "color:#b86bff;font-weight:bold;");
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < CONFIG.starCount; i++) {
      const layer = Math.random();
      stars.push({
        baseAngle: Math.random() * Math.PI * 2,
        radius: 70 + Math.random() * 85,
        speed: 0.002 + Math.random() * 0.005,
        size: layer > 0.7 ? 2 + Math.random() * 1.5 : 0.8 + Math.random() * 1.2,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.02 + Math.random() * 0.035,
        yOffset: (Math.random() - 0.5) * 70,
        layer: layer,
        // 星星拖尾
        trail: []
      });
    }
  }

  function startExpression() {
    expressionTimer = setInterval(() => {
      // 淡出
      targetImgOpacity = 0;
      setTimeout(() => {
        currentExpression = currentExpression === "open" ? "close" : "open";
        imgEl.src = currentExpression === "open" ? CONFIG.imgOpen : CONFIG.imgClose;
        targetImgOpacity = 1;
      }, 350);
    }, CONFIG.expressionInterval);
  }

  function bindEvents() {
    robotEl.addEventListener("pointerdown", (ev) => {
      drag.active = true; drag.moved = false;
      drag.ox = ev.clientX; drag.oy = ev.clientY;
      robotEl.style.cursor = "grabbing";
      ev.preventDefault();
    });
    window.addEventListener("pointermove", (ev) => {
      if (!drag.active) return;
      const dx = ev.clientX - drag.ox, dy = ev.clientY - drag.oy;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
      drag.rx += dx; drag.ry += dy;
      drag.ox = ev.clientX; drag.oy = ev.clientY;
      drag.rx = Math.max(-CONFIG.dragBoundaryX, Math.min(CONFIG.dragBoundaryX, drag.rx));
      drag.ry = Math.max(-CONFIG.dragBoundaryY, Math.min(CONFIG.dragBoundaryY, drag.ry));
    });
    window.addEventListener("pointerup", () => {
      if (drag.active && !drag.moved && CONFIG.onClickJumpUrl) {
        window.location.href = CONFIG.onClickJumpUrl;
      }
      drag.active = false;
      robotEl.style.cursor = "grab";
    });
  }

  function animate() {
    time += 0.016;

    // 呼吸浮动
    const floatY = Math.sin(time * 1.2) * 5;
    const floatX = Math.sin(time * 0.8) * 1.5;
    const scale = 1 + Math.sin(time * 1.5) * 0.008;
    robotEl.style.transform = `translate(calc(-50% + ${drag.rx + floatX}px), calc(-50% + ${drag.ry + floatY}px)) scale(${scale})`;

    // 表情淡入淡出
    imgOpacity += (targetImgOpacity - imgOpacity) * 0.1;
    imgEl.style.opacity = imgOpacity;

    // 呼吸光晕脉动
    const glowScale = 1 + Math.sin(time * 1.8) * 0.06;
    const glowOpacity = 0.7 + Math.sin(time * 1.8) * 0.3;
    glowEl.style.transform = `translate(-50%,-50%) scale(${glowScale})`;
    glowEl.style.opacity = glowOpacity;

    // 底座呼吸
    baseEl.style.opacity = 0.6 + Math.sin(time * 1.8 + 0.5) * 0.4;

    // 光环旋转
    ringEl.style.transform = `translate(-50%,-50%) rotate(${time * 20}deg)`;
    ringEl.style.opacity = 0.5 + Math.sin(time * 1.5) * 0.3;

    // 绘制星星
    starCtx.clearRect(0, 0, CONFIG.containerW, CONFIG.containerH);
    const cx = CONFIG.containerW / 2;
    const cy = CONFIG.containerH * 0.42;

    for (let s of stars) {
      s.baseAngle += s.speed;
      s.phase += s.twinkleSpeed;
      const x = cx + Math.cos(s.baseAngle) * s.radius;
      const y = cy + Math.sin(s.baseAngle) * s.radius * 0.55 + s.yOffset;
      const alpha = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(s.phase));
      const size = s.size * (0.6 + 0.4 * Math.sin(s.phase));

      // 外层光晕
      if (s.layer > 0.6) {
        starCtx.beginPath();
        starCtx.arc(x, y, size * 3, 0, Math.PI * 2);
        const grad = starCtx.createRadialGradient(x, y, 0, x, y, size * 3);
        grad.addColorStop(0, `rgba(${CONFIG.glowPurple},${alpha * 0.3})`);
        grad.addColorStop(1, "transparent");
        starCtx.fillStyle = grad;
        starCtx.fill();
      }

      // 星星核心
      starCtx.beginPath();
      starCtx.arc(x, y, size, 0, Math.PI * 2);
      starCtx.fillStyle = s.layer > 0.7
        ? `rgba(${CONFIG.glowCyan},${alpha})`
        : `rgba(210,170,255,${alpha})`;
      starCtx.fill();

      // 十字星芒（大星星）
      if (s.layer > 0.75 && alpha > 0.5) {
        starCtx.strokeStyle = `rgba(255,255,255,${alpha * 0.4})`;
        starCtx.lineWidth = 0.5;
        starCtx.beginPath();
        starCtx.moveTo(x - size * 2.5, y);
        starCtx.lineTo(x + size * 2.5, y);
        starCtx.moveTo(x, y - size * 2.5);
        starCtx.lineTo(x, y + size * 2.5);
        starCtx.stroke();
      }
    }

    animationId = requestAnimationFrame(animate);
  }

  return {
    init: () => waitMount(buildDom),
    destroy: () => {
      clearInterval(expressionTimer);
      cancelAnimationFrame(animationId);
      if (wrapEl) wrapEl.remove();
    }
  };
})();

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => ZacharyRobot.init());
} else {
  ZacharyRobot.init();
}
</script>
</body>
</html>
