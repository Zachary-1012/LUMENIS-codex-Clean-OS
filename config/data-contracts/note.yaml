# 笔记数据契约（DataQualityGate · write-time validation）
contract:
  name: note
  version: "1.2"
  owner: "ZBC Collector"
  status: active
  rules:
    - name: title_not_empty
      type: not_empty
      field: title
      severity: error
    - name: url_format
      type: regex
      field: url
      pattern: "^https?://.+"
      severity: error
    - name: risk_level_valid
      type: allowed_values
      field: risk_level
      allowed_values: [low, medium, high, critical, unconfirmed]
      severity: warning
    - name: publish_date_format
      type: date_format
      field: publish_date
      format: ["%Y-%m-%d %H:%M:%S", "%Y-%m-%d", "%Y-%m-%dT%H:%M:%S%z", "%Y-%m-%dT%H:%M:%S.%f%z", "%a, %d %b %Y %H:%M:%S %z"]
      missing_state: missing
      severity: error
    - name: title_length
      type: max_length
      field: title
      max_length: 500
      severity: warning
