{% extends "base.html" %}
{% block title %}Repository Registry · 序境 LUMENIS{% endblock %}
{% block page_title %}Repository Registry{% endblock %}

{% block content %}
<section class="lm-card lm-card--flat" style="margin-bottom:var(--lm-space-md);">
  <div class="lm-card__body lm-row" style="justify-content:space-between;align-items:center;">
    <div>
      <div class="lm-card__title" style="font-size:18px;" data-i18n="rp.title">仓库注册中心</div>
      <div style="font-size:13px;color:var(--lm-text-secondary);margin-top:4px;" data-i18n="rp.subtitle">物理独立 · 通过 Contract 逻辑融合，禁止物理合并</div>
    </div>
    <button class="lm-btn lm-btn--ghost lm-btn--sm" id="rp-refresh" data-i18n="common.refresh">刷新</button>
  </div>
</section>

<section class="lm-card" data-state="loading" data-component="repo-list">
  <div class="lm-card__head"><h3 class="lm-card__title" data-i18n="rp.repos">仓库状态</h3></div>
  <div class="lm-card__body lm-stack" id="rp-list"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function(){
  Object.assign(LUMENIS.i18n.dict.zh,{
    'rp.title':'仓库注册中心','rp.subtitle':'物理独立 · 通过 Contract 逻辑融合，禁止物理合并',
    'rp.repos':'仓库状态','rp.branch':'分支','rp.dirty':'未提交变更','rp.clean':'工作区干净','rp.unavailable':'不可用',
    'rp.role_prod':'生产核心','rp.role_intel':'智能核心','rp.role_research':'独立研究产品'
  });
  Object.assign(LUMENIS.i18n.dict.en,{
    'rp.title':'Repository Registry','rp.subtitle':'Physically independent · logical fusion via contracts; no physical merge',
    'rp.repos':'Repositories','rp.branch':'Branch','rp.dirty':'Uncommitted','rp.clean':'Clean tree','rp.unavailable':'Unavailable',
    'rp.role_prod':'Production Core','rp.role_intel':'Intelligence Core','rp.role_research':'Independent Research'
  });
  Object.assign(LUMENIS.i18n.dict.ko,{
    'rp.title':'리포지토리 레지스트리','rp.subtitle':'물리적으로 독립 · Contract를 통한 논리 통합, 물리 병합 금지',
    'rp.repos':'리포지토리 상태','rp.branch':'브랜치','rp.dirty':'커밋되지 않은 변경','rp.clean':'깨끗한 작업트리','rp.unavailable':'사용 불가',
    'rp.role_prod':'프로덕션 코어','rp.role_intel':'인텔리전스 코어','rp.role_research':'독립 연구 제품'
  });
  LUMENIS.i18n.setLang(LUMENIS.i18n.current);
  function t(k){var d=LUMENIS.i18n.dict[LUMENIS.i18n.current]||{};return d[k]||k;}
  var card=document.querySelector('[data-component="repo-list"]');
  var box=document.getElementById('rp-list');
  function load(){
    card.setAttribute('data-state','loading');
    LUMENIS.fetch('/api/system/repository').then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok){card.setAttribute('data-state','error');box.textContent=t('rp.unavailable');return;}
      card.setAttribute('data-state','success');
      box.innerHTML=(d.repos||[]).map(function(r){
        var g=r.git||{};
        var clean=g.clean;
        var badge=clean?'<span class="lm-badge lm-badge--success">'+t('rp.clean')+'</span>':'<span class="lm-badge lm-badge--warning">'+t('rp.dirty')+': '+g.dirty_files+'</span>';
        return '<div class="lm-card lm-card--flat" style="padding:var(--lm-space-md);margin-bottom:var(--lm-space-sm);">'+
          '<div class="lm-row" style="justify-content:space-between;"><strong>'+r.repository_id+' · '+r.name+'</strong>'+badge+'</div>'+
          '<div style="font-size:12.5px;color:var(--lm-text-secondary);margin-top:6px;line-height:1.8;">'+
          '<div>'+r.role+'</div>'+
          '<div style="font-family:var(--lm-font-mono,monospace);">HEAD '+ (g.head_sha||'–')+' · '+t('rp.branch')+': '+(g.branch||'–')+'</div>'+
          '<div style="color:var(--lm-text-tertiary);word-break:break-all;">'+r.path+'</div></div></div>';
      }).join('');
    }).catch(function(){card.setAttribute('data-state','error');box.textContent=t('rp.unavailable');});
  }
  document.getElementById('rp-refresh').addEventListener('click',load);
  load();
})();
</script>
{% endblock %}
