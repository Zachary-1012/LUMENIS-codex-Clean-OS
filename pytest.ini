[pytest]
# LUMENIS unified pytest entrypoint.
# Script-style test_ files with module-level exits are excluded by tests/conftest.py
# and remain runnable explicitly when required.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q -p no:cacheprovider --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    online: requires real network/platform/CDP and must be explicitly enabled
    environment: requires local credential/session/browser/runtime state
    production_data: requires protected production or production-candidate data
    integration: repository-level integration test with deterministic fixtures
    slow: slower deterministic test
    redline: subject/time/risk/event/report red-line contract test
