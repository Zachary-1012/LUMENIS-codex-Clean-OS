# 营销节点数据契约（DataQualityGate）
# 对齐 marketing_nodes 表（节日/节气/营销节点 Truth Surface）
contract:
  name: marketing_node
  version: "1.0"
  owner: "ZBC Marketing Calendar"
  status: active
  rules:
    - name: node_key_not_empty
      type: not_empty
      field: node_key
      severity: error
    - name: name_not_empty
      type: not_empty
      field: name
      severity: error
    - name: date_format
      type: date_format
      field: date
      format: "%Y-%m-%d"
      severity: error
    - name: category_valid
      type: allowed_values
      field: category
      allowed_values: [festival, solar_term, marketing_node, campaign, seasonal]
      severity: warning
    - name: region_valid
      type: allowed_values
      field: region
      allowed_values: [CN, HK, US, EU, ME, LATAM, GLOBAL, "APAC"]
      severity: warning
