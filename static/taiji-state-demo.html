<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taiji 状态管线原语 · 参考实现</title>
<link rel="stylesheet" href="/static/css/taiji-state.css">
<style>
  body { font-family:'Roboto','PingFang SC','Segoe UI',Arial,sans-serif; background:#f4f3ee; color:#1a1b1c; margin:0; padding:20px; max-width:1080px; margin:0 auto; }
  h2 { font-size:17px; margin:24px 0 8px; }
  .card { background:#fff; border:1px solid #e4e3dd; border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .hint { font-size:12px; color:#6b7280; line-height:1.6; }
  .btns { margin:10px 0; }
  .btns button { min-height:36px; padding:6px 14px; margin-right:8px; border:1px solid #cbd5e1; background:#fff; border-radius:8px; cursor:pointer; font-size:13px; }
  .btns button:focus-visible { outline:3px solid #2563eb; outline-offset:2px; }
</style>
</head>
<body>
<h1 style="font-size:20px;">Taiji State Pipeline · 芥子·须弥 状态可见层</h1>
<p class="hint">纯展示原语：阶段与证据由调用方传入，组件不持业务 Truth、不造假。颜色之外同时用序号/✓/形状/文字编码；节点可点击/键盘（Tab+Enter、左右箭头）下钻证据；动效仅表达"进行中"状态，并尊重系统减少动态设置。</p>

<h2>① 标准信号→决策九态（当前：影响研判）</h2>
<div class="card"><div id="p1"></div></div>

<h2>② 创意生成的 芥子→须弥→芥子 循环</h2>
<div class="card"><div id="p2"></div></div>

<div class="btns">
  <button onclick="advance()">推进阶段（演示连续性动效）</button>
  <button onclick="reset_()">重置</button>
</div>
<p class="hint">说明：下方推进仅演示组件的状态渲染；真实使用时 current/evidence 由后端 Runtime/Evidence 实时驱动，视觉状态不会超出数据支持的事实。</p>

<script src="/static/js/taiji-state.js"></script>
<script>
(function(){
  // 实例①：舆情信号管线（证据字段示意真实数据形状）
  var stages1 = [
    {key:'input',label:'输入信号',evidence:'原始笔记 128 条 / 评论 2,043 条，采集于 11:40',src:'xhs_collector.last_success_at'},
    {key:'detected',label:'已检测',evidence:'命中话题「秋日艺术季」相关 37 条',src:'topic_matcher'},
    {key:'verified',label:'已核验',evidence:'去重后 31 条，去重率 16.2%；无伪造',src:'data_quality 软门'},
    {key:'classified',label:'已分类',evidence:'正向 22 / 中性 7 / 负向 2',src:'sentiment'},
    {key:'correlated',label:'已关联',evidence:'与「展览打卡」事件 E-2031 相关，相关度 0.78',src:'event_cluster'},
    {key:'risk',label:'影响研判',evidence:'负向集中在排队体验，风险等级：低-中',src:'risk_engine'},
    {key:'decision',label:'决策',evidence:'',src:''},
    {key:'action',label:'行动生产',evidence:'',src:''},
    {key:'feedback',label:'反馈学习',evidence:'',src:''}
  ];
  // 实例②：创意循环（芥子=真实信号，须弥=抽象能力，回流再生产）
  var stages2 = [
    {key:'signal',label:'芥子·真实信号',evidence:'序境：艺术季话题互动率高于均值 2.3 倍',src:'brand_insight'},
    {key:'abstract',label:'须弥·抽象机制',evidence:'提炼机制：把「排队」反转为「预约即专属」',src:'idea_generator'},
    {key:'idea',label:'原创 Idea',evidence:'Big Idea：预约制城市艺术客厅',src:'campaign_plan'},
    {key:'contract',label:'一·Contract',evidence:'经能力契约下发，不改业务 Truth/权限',src:'capability_contract'},
    {key:'produce',label:'序境生产',evidence:'生成视频脚本/9 平台社媒打法/比稿骨架',src:'video_script/social_ops'},
    {key:'feedback',label:'反馈回流',evidence:'投放后完播/互动/转化回流，更新下一轮信号',src:'observatory'}
  ];
  var cur1 = 5, handles = [];
  function draw(c1, c2){
    document.getElementById('p1').innerHTML='';
    document.getElementById('p2').innerHTML='';
    handles[0] = TaijiState.renderPipeline(document.getElementById('p1'),
      {stages:stages1, current:c1, loopNote:'FEEDBACK 回流为下一轮「芥子」信号 —— 芥子纳须弥，循环自增殖'});
    handles[1] = TaijiState.renderPipeline(document.getElementById('p2'),
      {stages:stages2, current:c2, loopNote:'形可变，道不可移：呈现可个性化，Truth / Contract / 权限不变'});
  }
  draw(cur1, 4);
  window.advance = function(){ cur1 = Math.min(cur1+1, 8); draw(cur1, Math.min(cur1>=6?5:4,5)); };
  window.reset_ = function(){ cur1=5; draw(5,4); };
})();
</script>
</body>
</html>
