name: lumenis_app
description: LUMENIS cross-platform product experience.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.9
  go_router: ^18.0.1
  http: ^1.6.0
  file_selector: ^1.0.4
  shared_preferences: ^2.5.3
  flutter_acrylic: ^1.1.4
  macos_window_utils: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansSC-OFL.txt
    - assets/fonts/NotoSansKR-OFL.txt
    - assets/fonts/NotoColorEmoji-OFL.txt
    - assets/wallpapers/crimson-sunset.jpg
    - assets/wallpapers/cobalt-dusk.jpg
  fonts:
    - family: LumenisSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: LumenisSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
    - family: LumenisEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
