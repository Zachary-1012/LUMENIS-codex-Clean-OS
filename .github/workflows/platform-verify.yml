name: LUMENIS Product Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumenis-product-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: production source integrity + runtime prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate AI-native product constitution execution chain (BLOCKING)
        run: python scripts/audit_tools/verify_ai_native_constitution.py

      - name: Validate four-product contract and LUMENIS authority (BLOCKING)
        run: >-
          python scripts/audit_tools/verify_lumenis_ggi_contract.py
          00-GOVERNANCE/LUMENIS-GGI-CROSS-PRODUCT-CONTRACT-V1.json

      - name: Validate machine governance semantics (BLOCKING)
        run: python scripts/audit_tools/verify_governance_machine_contract.py

      - name: Validate governance history/authority regressions (BLOCKING)
        run: python scripts/audit_tools/verify_codex_takeover_governance.py

      - name: Validate current configuration and Flutter toolchain (BLOCKING)
        run: python scripts/audit_tools/verify_current_configuration.py

      - name: Validate Only-One multi-surface product architecture (BLOCKING)
        run: python scripts/audit_tools/verify_lumenis_single_product.py

      - name: Validate Shared Database authority (BLOCKING)
        run: python scripts/audit_tools/verify_database_authority.py

      - name: Validate sole Experience design authority (BLOCKING)
        run: python scripts/audit_tools/verify_experience_authority_exclusive.py

      - name: Validate multi-surface Experience anti-template contract (BLOCKING)
        shell: bash
        run: |
          python scripts/audit_tools/experience_gate_mode.py --base "${{ github.event.pull_request.base.sha || github.event.before }}" --head HEAD --run

      - name: Validate bespoke screen UX blueprints and binding inventory (BLOCKING)
        run: python scripts/audit_tools/verify_experience_screen_blueprints.py

      - name: Compile tracked Python sources (BLOCKING)
        shell: bash
        run: |
          python_files="$(git ls-files '*.py' | wc -l | xargs)"
          test "$python_files" -gt 0
          echo "Compiling ${python_files} tracked Python files"
          git ls-files -z '*.py' | xargs -0 -r -n 120 python -m py_compile

      # PO-20261010: restore isolated unit/integration regression evidence.
      # Real product user acceptance remains independently required.
      - name: Install product runtime dependencies (EXECUTION-LAYER)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --retries 4 --timeout 30 -r requirements.txt

      - name: Credential-path boundary (BLOCKING)
        shell: bash
        run: |
          python - <<'PY'
          import data_boundary
          result = data_boundary.assert_no_tracked_credentials('.')
          print('status:', result['status'])
          print('tracked_total:', result['tracked_total'])
          print('leak_count:', len(result['leaks']))
          for path in result['leaks']:
              print('tracked-boundary-path:', path)
          raise SystemExit(0 if result['status'] == 'pass' else 1)
          PY

      - name: Prepare product schema and media tools (BLOCKING)
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Prepare disposable product schema (BLOCKING)
        shell: bash
        run: |
          seed_dir="$(mktemp -d "$RUNNER_TEMP/lumenis-runtime-schema.XXXXXX")"
          export ZBC_DATA_DIR="$seed_dir"
          export ZBC_DB_PATH="$seed_dir/monitor-runtime-schema.db"
          python -c "from lumenis.shared.database.migrations import migrate; assert migrate(), 'Disposable schema bootstrap failed'"


      - name: Run isolated unit and integration regressions (BLOCKING)
        timeout-minutes: 6
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install --disable-pip-version-check --retries 3 --timeout 30 pytest
          python - <<'PY'
          import os, pathlib, socket, tempfile
          root = pathlib.Path(tempfile.mkdtemp(prefix='lumenis-ci-regression-'))
          for key in list(os.environ):
              if key.startswith(('ZBC_', 'TAIKOO_', 'XHS_', 'LUMENIS_', 'AI_', 'OPENAI_', 'ANTHROPIC_', 'ZHIPU_')):
                  os.environ.pop(key, None)
          os.environ.update(ZBC_DB_PATH=str(root/'seed.sqlite3'), ZBC_DATA_DIR=str(root),
              LUMENIS_TEST_SEED_DB=str(root/'seed.sqlite3'), ZBC_TEST_OFFLINE='1',
              XHS_PRODUCTION='0', ZBC_PREFLIGHT_ENFORCE='0', ZBC_GUARDIAN_ENABLED='0')
          def denied(*args, **kwargs):
              raise RuntimeError('ISOLATED_REGRESSION_NETWORK_FORBIDDEN')
          socket.socket.connect = denied
          socket.socket.connect_ex = denied
          socket.create_connection = denied
          import pytest
          raise SystemExit(pytest.main(['-vv', '--tb=short', '-p', 'no:cacheprovider',
              'tests/test_rectification_truth_chain_20261010.py',
              'tests/test_governance_machine_contract.py', 'tests/test_online_progress_governance.py', '.codex/tests/test_engineering.py',
              'tests/test_ai_task_engine.py', 'tests/test_content_generation_parent_evidence.py',
              'tests/test_xhs_cdp_native_truth.py', 'tests/test_source_brief_job.py',
              'tests/test_business_decision_workflow.py', 'tests/test_runtime_api_diagnostics.py',
              'tests/agent_capability/test_router.py',
              'tests/agent_runtime/test_formation_dispatch.py', 'tests/test_business_brief_typed_owned.py',
              'tests/test_user_api_adapter.py', 'tests/test_user_api_consent_binding.py',
              'tests/test_boundary_permission_owner.py', 'tests/test_mainline_gate_fail_closed.py',
              'tests/test_runtime_preflight.py', 'tests/test_safety_boundary.py',
              'tests/test_safety_boundary_backup_contract.py', 'tests/test_instagram_partial_collection.py',
              'tests/test_instagram_main_adapter.py', 'tests/test_ai_gateway_result_status.py',
              'tests/test_root_owner_auth_composition.py',
              'tests/test_scoped_topic_labels.py',
              # CPython 3.11 worker-entry matrix: real local processes only,
              # no network/model/training. Full affected recovery runs are
              # separately recorded on the frozen source with synthetic DBs.
              'tests/test_owned_training_runtime_recovery.py::test_source_pinned_managed_worker_has_actual_private_peer_and_stop_replacement',
              'tests/test_owned_training_runtime_recovery.py::test_unbound_invocation_reaps_real_managed_worker_without_waiting',
              'tests/test_owned_training_runtime_recovery.py::test_managed_worker_preserves_private_venv_for_start_replace_and_reap',
              'tests/test_owned_training_runtime_recovery.py::test_managed_worker_rejects_invalid_interpreter_before_spawn',
              'tests/test_owned_training_runtime_recovery.py::test_managed_worker_rejects_identity_or_entry_change_and_reaps']))
          PY

      - name: Record gate scope (INFORMATIONAL)
        if: ${{ always() }}
        run: |
          echo "Authorized isolated unit/integration regressions are blocking engineering evidence; actual execution status is recorded above."
          echo "Historical failures remain failed; real E2E and user acceptance require separate actual evidence."
          echo "This source/runtime-prerequisite gate alone does not close a user job or release."

      - name: Boundary Check (BLOCKING)
        if: ${{ always() }}
        run: python scripts/audit_tools/boundary_check.py --ci
