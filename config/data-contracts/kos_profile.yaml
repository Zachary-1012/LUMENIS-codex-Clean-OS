# KOS 账号资产数据契约（DataQualityGate · write-time validation）
# 对齐 kos_profiles 表 59 字段核心域 + 主体归属 Gate 硬规则
contract:
  name: kos_profile
  version: "1.0"
  owner: "ZBC KOS Engine"
  status: active
  rules:
    - name: author_id_not_empty
      type: not_empty
      field: author_id
      severity: error
    - name: author_nickname_not_empty
      type: not_empty
      field: author_nickname
      severity: error
    - name: kos_score_range
      type: range
      field: kos_score
      min: 0
      max: 100
      severity: warning
    - name: ownership_type_valid
      type: allowed_values
      field: ownership_type
      allowed_values: [TARGET_ENTITY, BRAND, MERCHANT, PARTNER, INDEPENDENT_KOL_KOC, UGC, MEDIA, OFFICIAL, UNKNOWN]
      severity: error
    - name: ownership_confidence_range
      type: range
      field: ownership_confidence
      min: 0
      max: 1
      severity: warning
    - name: kos_tier_valid
      type: allowed_values
      field: kos_tier
      allowed_values: [S, A, B, C]
      severity: warning
    - name: lifecycle_stage_valid
      type: allowed_values
      field: lifecycle_stage
      allowed_values: [discovered, observing, growing, stable, breakout, cooperating, core, dormant]
      severity: warning
    - name: note_count_min
      type: min
      field: note_count
      min: 0
      severity: error
    - name: engagement_rate_range
      type: range
      field: engagement_rate
      min: 0
      max: 100
      severity: warning
