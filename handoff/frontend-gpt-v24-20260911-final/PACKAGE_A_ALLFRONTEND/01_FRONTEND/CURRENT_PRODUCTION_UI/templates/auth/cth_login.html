<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>序境·商业运营 登录 · LUMENIS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cth-primary:#2563eb;--cth-primary-light:#3b82f6;--cth-bg:#f0f4ff;
  --text:#1e293b;--text-light:#64748b;--border:#e2e8f0;
  --radius:20px;--shadow:0 8px 32px rgba(37,99,235,.12);
}
html,body{height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 50%,#bfdbfe 100%);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
body::before{
  content:'';position:absolute;top:-20%;right:-10%;width:600px;height:600px;
  background:radial-gradient(circle,rgba(59,130,246,.15) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.login-card{
  width:400px;max-width:92vw;background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:40px 36px;position:relative;z-index:1;
  border:1px solid rgba(255,255,255,.6);
}
.login-header{text-align:center;margin-bottom:32px}
.login-header .logo{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(135deg,var(--cth-primary),var(--cth-primary-light));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;color:#fff;font-size:24px;font-weight:700;
  box-shadow:0 4px 16px rgba(37,99,235,.3);
}
.login-header h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.login-header p{font-size:13px;color:var(--text-light)}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px}
.form-group input{
  width:100%;padding:14px 16px;border:1.5px solid var(--border);
  border-radius:12px;font-size:15px;background:#fff;
  transition:border-color .2s,box-shadow .2s;outline:none;
}
.form-group input:focus{border-color:var(--cth-primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn-primary{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--cth-primary),var(--cth-primary-light));
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  transition:transform .15s,box-shadow .2s;
  box-shadow:0 4px 12px rgba(37,99,235,.25);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.35)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error-msg{
  background:#fef2f2;border:1px solid #fecaca;color:#dc2626;
  padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;
  display:none;
}
.error-msg.show{display:block}
.footer-note{text-align:center;margin-top:24px;font-size:12px;color:var(--text-light)}
.footer-note a{color:var(--cth-primary);text-decoration:none}
.domain-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(37,99,235,.1);color:var(--cth-primary);
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;
  margin-bottom:12px;
}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="logo">序境·商业运营</div>
    <div class="domain-badge">太古汇舆情域</div>
    <h1>登录 序境·商业运营</h1>
    <p>输入账号密码进入舆情监控系统</p>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <form id="loginForm">
    <div class="form-group">
      <label for="username">账号</label>
      <input type="text" id="username" name="username" autocomplete="username" placeholder="请输入账号" required>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn">登 录</button>
  </form>
  <div class="footer-note">
    <a href="/lumenis/cth/overview">返回首页</a> · <a href="/auth/recovery">忘记密码</a>
  </div>
  <div style="margin-top:16px;text-align:center;font-size:11px;color:rgba(37,99,235,.6)">
    登录后可在CTH导航栏底部「进入序境·品牌市场」通过动态验证码切换域
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');
  btn.disabled = true; btn.textContent = '登录中...';
  errEl.classList.remove('show');
  try{
    const resp = await fetch('/v4/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username:document.getElementById('username').value,
        password:document.getElementById('password').value
      })
    });
    const data = await resp.json();
    if(data.success){
      if(data.token){
        document.cookie = 'cth_poms_v4_session='+data.token+';path=/;max-age=604800;SameSite=Lax';
      }
      window.location.href = '/lumenis/cth/overview';
    } else {
      errEl.textContent = data.error || '登录失败';
      errEl.classList.add('show');
      btn.disabled = false; btn.textContent = '登 录';
    }
  }catch(err){
    errEl.textContent = '网络错误：'+err.message;
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = '登 录';
  }
});
</script>
</body>
</html>
