<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>登录 · CTH-POMS</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #eef2ff 0%, #f2f2f7 55%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      color: #1c1c1e;
    }
    .card {
      width: 100%; max-width: 380px; background: rgba(255,255,255,.92);
      backdrop-filter: blur(20px); border-radius: 22px; padding: 28px 24px 26px;
      box-shadow: 0 18px 50px rgba(60,70,120,.16);
    }
    .brand { text-align: center; margin-bottom: 18px; }
    .brand .logo {
      width: 60px; height: 60px; border-radius: 18px; margin: 0 auto 10px;
      background: linear-gradient(135deg, #5b7cfa, #8e5bfa);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 20px; letter-spacing: .5px;
      box-shadow: 0 8px 20px rgba(91,124,250,.35);
    }
    .brand h1 { font-size: 18px; margin: 4px 0 2px; font-weight: 650; }
    .brand p { font-size: 12px; color: #8e8e93; margin: 0; }

    /* 分段切换控件 */
    .seg {
      position: relative; display: flex; background: #e9e9ee; border-radius: 11px;
      padding: 3px; margin: 16px 0 18px;
    }
    .seg .slider {
      position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: calc(100% - 6px);
      background: #fff; border-radius: 9px; box-shadow: 0 2px 6px rgba(0,0,0,.12);
      transition: transform .24s cubic-bezier(.4,0,.2,1);
    }
    .seg.key-mode .slider { transform: translateX(100%); }
    .seg button {
      flex: 1; position: relative; z-index: 1; border: 0; background: transparent;
      padding: 9px 0; font-size: 14px; font-weight: 600; color: #6b6b70;
      cursor: pointer; border-radius: 9px; transition: color .24s;
    }
    .seg button.active { color: #1c1c1e; }

    .pane { display: none; }
    .pane.active { display: block; animation: fade .22s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 12px; color: #6e6e73; margin: 0 2px 5px; font-weight: 600; }
    .field input {
      width: 100%; padding: 13px 14px; border: 1px solid #e2e2e7; border-radius: 12px;
      font-size: 15px; background: #f9f9fb; outline: none; transition: border-color .18s, background .18s;
    }
    .field input:focus { border-color: #007aff; background: #fff; }
    .btn {
      width: 100%; padding: 13px; border: 0; border-radius: 13px; background: #007aff;
      color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 4px;
      transition: transform .1s, opacity .18s;
    }
    .btn:active { transform: scale(.985); }
    .btn:disabled { opacity: .55; cursor: default; }
    .err {
      min-height: 18px; font-size: 13px; color: #ff3b30; text-align: center;
      margin: 9px 2px 0; word-break: break-all;
    }
    .foot { text-align: center; font-size: 11.5px; color: #aeaeb2; margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">CTH</div>
      <h1>广州太古汇舆情监控系统</h1>
      <p>CorTech Lab · Taikoo Hui POMS</p>
    </div>

    <div class="seg" id="seg">
      <div class="slider"></div>
      <button type="button" id="tabPwd" class="active">账号密码</button>
      <button type="button" id="tabKey">密钥登录</button>
    </div>

    <!-- 账号密码 -->
    <div class="pane active" id="panePwd">
      <div class="field"><label>用户名</label><input id="username" autocomplete="username" placeholder="Zachary"></div>
      <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
      <button class="btn" id="btnPwd">登录</button>
      <div class="err" id="errPwd"></div>
    </div>

    <!-- 密钥 -->
    <div class="pane" id="paneKey">
      <div class="field"><label>访问密钥</label><input id="accessKey" placeholder="请输入主账号访问密钥"></div>
      <button class="btn" id="btnKey">密钥进入</button>
      <div class="err" id="errKey"></div>
    </div>

    <div class="foot">V4 安全登录 · 登录操作将记入审计日志<br>现网 Basic 登录仍可正常使用，二者互不影响</div>
  </div>

<script>
const seg = document.getElementById('seg');
let mode = 'pwd';
function switchMode(m) {
  mode = m;
  seg.classList.toggle('key-mode', m === 'key');
  document.getElementById('tabPwd').classList.toggle('active', m === 'pwd');
  document.getElementById('tabKey').classList.toggle('active', m === 'key');
  document.getElementById('panePwd').classList.toggle('active', m === 'pwd');
  document.getElementById('paneKey').classList.toggle('active', m === 'key');
}
document.getElementById('tabPwd').onclick = () => switchMode('pwd');
document.getElementById('tabKey').onclick = () => switchMode('key');

function afterLogin(d) {
  localStorage.setItem('v4_token', d.token);
  localStorage.setItem('v4_user', JSON.stringify(d.user || {}));
  const next = new URLSearchParams(location.search).get('next');
  location.href = next || '/v4/settings/';
}
async function post(url, body, errEl, btn) {
  errEl.textContent = ''; btn.disabled = true;
  try {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if (d.success) afterLogin(d);
    else errEl.textContent = d.error || ('登录失败(' + r.status + ')');
  } catch (e) { errEl.textContent = '网络错误：' + e.message; }
  btn.disabled = false;
}
document.getElementById('btnPwd').onclick = () => post('/v4/auth/login', {
  username: document.getElementById('username').value.trim(),
  password: document.getElementById('password').value,
}, document.getElementById('errPwd'), document.getElementById('btnPwd'));
document.getElementById('btnKey').onclick = () => post('/v4/auth/login-by-key', {
  access_key: document.getElementById('accessKey').value.trim(),
}, document.getElementById('errKey'), document.getElementById('btnKey'));
// 回车提交
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnPwd').click(); });
document.getElementById('accessKey').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnKey').click(); });
</script>
</body>
</html>
