{% extends "base.html" %}

{% block title %}舆情笔记 - 广州太古汇舆情监测系统{% endblock %}

{% block content %}
<div class="notes-page">
    <section class="notes-section">
        <div class="section-header">
            <h2 class="section-title">舆情笔记</h2>
            <div class="filter-bar">
                <input type="text" id="note-search" placeholder="搜索笔记标题、内容..." />
                <select id="note-sentiment-filter">
                    <option value="">全部情感</option>
                    <option value="positive">正面</option>
                    <option value="neutral">中性</option>
                    <option value="negative">负面</option>
                </select>
                <select id="note-risk-filter">
                    <option value="">全部风险</option>
                    <option value="high">高风险</option>
                    <option value="medium">中风险</option>
                    <option value="low">低风险</option>
                </select>
                <select id="note-date-filter">
                    <option value="">全部时间</option>
                    <option value="today">今日发布</option>
                    <option value="week">本周发布</option>
                    <option value="month">本月发布</option>
                </select>
                <button class="btn btn-primary" onclick="searchNotes()">搜索</button>
            </div>
        </div>

        <div class="notes-stats">
            <span>总计: <strong id="notes-total">0</strong> 条</span>
            <span>今日发布: <strong id="notes-published-today">0</strong> 条</span>
            <span>今日采集: <strong id="notes-collected-today">0</strong> 条</span>
            <span>负面: <strong id="notes-negative">0</strong> 条</span>
        </div>

        <div class="notes-list" id="notes-list">
            <div class="loading">加载中...</div>
        </div>

        <div class="pagination" id="notes-pagination">
            <button class="btn btn-secondary" onclick="prevPage()">上一页</button>
            <span id="page-info">第 1 页</span>
            <button class="btn btn-secondary" onclick="nextPage()">下一页</button>
        </div>
    </section>
</div>

<!-- 笔记详情弹窗 -->
<div id="note-detail-modal" class="modal" style="display:none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h3 id="note-detail-title">笔记详情</h3>
            <button class="modal-close" onclick="closeNoteDetail()">×</button>
        </div>
        <div class="modal-body" id="note-detail-content">
            <div class="loading">加载中...</div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-success" onclick="confirmNegative()">确认负面</button>
            <button class="btn btn-danger" onclick="rejectNegative()">驳回负面</button>
            <button class="btn btn-secondary" onclick="closeNoteDetail()">关闭</button>
        </div>
    </div>
</div>
{% endblock %}
