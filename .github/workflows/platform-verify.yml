name: Verify Z-Brand-Core via Zachary Platform Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    uses: Zachary-1012/Development-Command-Console/.github/workflows/reusable-verify.yml@448ba215c8b9516fa63c77ddcced5a54a68f2742
    with:
      runtime: python
      install_command: python -m pip install --disable-pip-version-check -r requirements.txt
