<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>序境 · 交互审核实验集</title><link rel="stylesheet" href="src/style.css"><body><button id="skipToWork" class="skip-work">跳至当前工作区</button>
<header><a href="#spring" class="wordmark">序境 <span>LUMENIS / STUDIES</span></a><div class="edition">交互审核 <span>独立示例，不接生产</span></div><button id="openSettings" aria-haspopup="dialog">设置</button></header>
<div class="layout"><nav aria-label="逐项审核"><p class="eyebrow">INTERACTION INDEX</p><div id="nav"></div><p class="nav-note">每一个动作，<br>都应有一个理由。</p><button id="exportReview">导出审核意见</button></nav><main id="workArea" tabindex="-1"><div class="title-line"><div><p class="eyebrow" id="category"></p><h1 id="title"></h1></div><span id="counter"></span></div><p id="description" class="lead"></p><div id="stage" class="stage"></div><div class="status" id="status" role="status" aria-live="polite">准备就绪</div><div class="actions" id="actions"></div><section class="review"><label>这一项的审核意见<textarea id="reviewNote" placeholder="例如：回弹太轻，落点希望更明确……"></textarea></label><div class="review-actions"><button data-vote="liked">保留方向</button><button data-vote="revise">需要调整</button><button data-vote="reject">不采用</button><button id="exportReviewMobile">导出意见</button><span id="voteStatus"></span></div></section></main><aside><p class="eyebrow">REVIEW CONTEXT</p><details open><summary>适用位置与边界</summary><p id="mapping"></p></details><details><summary>输入与降级</summary><p id="access"></p></details><details><summary>源码与运行证据</summary><p id="source"></p><button id="exportTrace">导出本次轨迹</button></details></aside></div><dialog id="reviewSettings" aria-labelledby="settingsTitle"><div class="settings-head"><h2 id="settingsTitle">交互与外观设置</h2><button id="closeSettings">返回工作</button></div><p>默认配置直接可用。这里统一调整动感与外观；工作区保留当前任务、编辑与位置。默认值为审核基线，仍需逐项优化验证。</p><label>动态<select id="motionPreference"><option value="system">跟随系统</option><option value="full">完整</option><option value="reduce">减少动态</option><option value="off">关闭</option></select></label><div class="settings-preview" aria-label="设置中的动感预览"><span id="settingsPreviewObject">预览</span></div><button id="previewSettings">预览动感</button><h3>当前示例的物理参数</h3><div id="params"></div><div class="actions"><button id="savePreferences">保存当前偏好</button><button id="restorePreferences">恢复默认</button></div><p id="preferenceStatus" role="status">调节即时预览；保存后仅此浏览器记住。</p><p id="settingsFeedback" role="status" aria-live="polite">修改即时预览；返回工作保留原任务。</p><section id="studySettings" aria-label="当前示例的专项设置"></section></dialog><footer>可交互审核样例 · 未修改现有产品 · 无模型、采集、发布或付款调用 <span>原始资料与业务事实始终独立</span></footer><script type="module" src="src/app.mjs"></script></body></html>
