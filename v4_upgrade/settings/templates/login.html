<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>登录 · Z-Brand Core</title>
  <script>
  /* fetch凭证修复：剥离URL中的Basic Auth凭证 */
  (function(){
    var _f = window.fetch.bind(window);
    window.fetch = function(input, init){
      try{
        if(typeof input === 'string'){
          if(input.indexOf('/')===0 && input.indexOf('//')!==0){ input = location.origin + input; }
          else if(input.indexOf('@')>-1 && /^https?:\/\//.test(input)){ input = input.replace(/^(https?:\/\/)[^@/]+@/, '$1'); }
        }
      }catch(e){}
      return _f(input, init);
    };
  })();
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    :root{
      --zb-bg:#FAFAF9; --zb-surface:#FFFFFF; --zb-surface-raised:#F5F5F4;
      --zb-border:#E7E5E4; --zb-border-strong:#D6D3D1;
      --zb-text:#1C1917; --zb-text-secondary:#57534E; --zb-text-muted:#A8A29E;
      --zb-accent:#1C1917; --zb-accent-hover:#44403C;
      --zb-success:#16A34A; --zb-danger:#DC2626;
      --radius:14px; --radius-sm:10px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--zb-bg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      color: var(--zb-text); position: relative; overflow: hidden;
    }
    /* 微光银背景层 */
    body::before{
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(214,211,209,0.25), transparent),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(168,162,158,0.12), transparent);
    }
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px; background: var(--zb-surface);
      border: 1px solid var(--zb-border);
      border-radius: 20px; padding: 32px 28px 28px;
      box-shadow: 0 2px 12px rgba(28,25,23,0.04), 0 12px 40px rgba(28,25,23,0.08);
      animation: cardIn .35s cubic-bezier(.4,0,.2,1);
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(12px) scale(.98)} to{opacity:1;transform:none} }
    .brand { text-align: center; margin-bottom: 22px; }
    .brand .logo {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px;
      background: linear-gradient(135deg, #1C1917, #44403C);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 17px; letter-spacing: .5px;
      box-shadow: 0 4px 14px rgba(28,25,23,.22);
    }
    .brand h1 { font-size: 19px; margin: 4px 0 4px; font-weight: 650; letter-spacing: -.01em; }
    .brand p { font-size: 12px; color: var(--zb-text-muted); margin: 0; letter-spacing: .02em; }

    /* 分段切换控件 */
    .seg {
      position: relative; display: flex; background: var(--zb-surface-raised);
      border: 1px solid var(--zb-border); border-radius: var(--radius-sm);
      padding: 3px; margin: 18px 0 20px;
    }
    .seg .slider {
      position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: calc(100% - 6px);
      background: var(--zb-surface); border-radius: 8px;
      box-shadow: 0 1px 3px rgba(28,25,23,.1);
      transition: transform .24s cubic-bezier(.4,0,.2,1);
    }
    .seg.key-mode .slider { transform: translateX(100%); }
    .seg button {
      flex: 1; position: relative; z-index: 1; border: 0; background: transparent;
      padding: 9px 0; font-size: 14px; font-weight: 600; color: var(--zb-text-muted);
      cursor: pointer; border-radius: 8px; transition: color .24s; font-family: inherit;
    }
    .seg button.active { color: var(--zb-text); }

    .pane { display: none; }
    .pane.active { display: block; animation: fade .22s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--zb-text-secondary); margin: 0 2px 6px; font-weight: 600; }
    .field input {
      width: 100%; padding: 13px 14px; border: 1px solid var(--zb-border); border-radius: var(--radius-sm);
      font-size: 15px; background: var(--zb-surface-raised); outline: none; font-family: inherit; color: var(--zb-text);
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    .field input:focus {
      border-color: var(--zb-text-muted); background: var(--zb-surface);
      box-shadow: 0 0 0 3px rgba(120,113,108,.12);
    }
    .btn {
      width: 100%; padding: 13px; border: 0; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #1C1917, #44403C);
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
      font-family: inherit; letter-spacing: .02em;
      transition: transform .1s, box-shadow .18s, opacity .18s;
      box-shadow: 0 2px 8px rgba(28,25,23,.18);
    }
    .btn:hover { box-shadow: 0 4px 14px rgba(28,25,23,.26); }
    .btn:active { transform: scale(.985); }
    .btn:disabled { opacity: .55; cursor: default; }
    .err {
      min-height: 18px; font-size: 13px; color: var(--zb-danger); text-align: center;
      margin: 10px 2px 0; word-break: break-all;
    }
    .foot { text-align: center; font-size: 11.5px; color: var(--zb-text-muted); margin-top: 18px; line-height: 1.7; }
    .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--zb-success);margin-right:4px;vertical-align:middle}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">ZBC</div>
      <h1>Z-Brand Core</h1>
      <p>CTH-POMS · Z-Brand Intelligence Platform</p>
    </div>

    <div class="seg" id="seg">
      <div class="slider"></div>
      <button type="button" id="tabPwd" class="active">账号密码</button>
      <button type="button" id="tabKey">密钥登录</button>
    </div>

    <!-- 账号密码 -->
    <div class="pane active" id="panePwd">
      <div class="field"><label>用户名</label><input id="username" autocomplete="username" placeholder="Zachary" value="Zachary"></div>
      <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
      <button class="btn" id="btnPwd">登录</button>
      <div class="err" id="errPwd"></div>
    </div>

    <!-- 密钥 -->
    <div class="pane" id="paneKey">
      <div class="field"><label>访问密钥</label><input id="accessKey" placeholder="请输入主账号访问密钥"></div>
      <button class="btn" id="btnKey">密钥进入</button>
      <div class="err" id="errKey"></div>
    </div>

    <div class="foot"><span class="status-dot"></span>V4 安全登录 · 登录操作将记入审计日志<br>现网 Basic 登录仍可正常使用，二者互不影响</div>
  </div>

<script>
const seg = document.getElementById('seg');
let mode = 'pwd';
function switchMode(m) {
  mode = m;
  seg.classList.toggle('key-mode', m === 'key');
  document.getElementById('tabPwd').classList.toggle('active', m === 'pwd');
  document.getElementById('tabKey').classList.toggle('active', m === 'key');
  document.getElementById('panePwd').classList.toggle('active', m === 'pwd');
  document.getElementById('paneKey').classList.toggle('active', m === 'key');
}
document.getElementById('tabPwd').onclick = () => switchMode('pwd');
document.getElementById('tabKey').onclick = () => switchMode('key');

function afterLogin(d) {
  localStorage.setItem('v4_token', d.token);
  localStorage.setItem('v4_user', JSON.stringify(d.user || {}));
  const next = new URLSearchParams(location.search).get('next');
  location.href = next || '/v4/settings/';
}
async function post(url, body, errEl, btn) {
  errEl.textContent = ''; btn.disabled = true;
  try {
    // 使用干净origin构建URL，避免Basic Auth凭证导致fetch失败
    const cleanUrl = url.indexOf('/')===0 ? location.origin + url : url;
    const r = await fetch(cleanUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if (d.success) afterLogin(d);
    else errEl.textContent = d.error || ('登录失败(' + r.status + ')');
  } catch (e) { errEl.textContent = '网络错误：' + e.message; }
  btn.disabled = false;
}
document.getElementById('btnPwd').onclick = () => post('/v4/auth/login', {
  username: document.getElementById('username').value.trim(),
  password: document.getElementById('password').value,
}, document.getElementById('errPwd'), document.getElementById('btnPwd'));
document.getElementById('btnKey').onclick = () => post('/v4/auth/login-by-key', {
  access_key: document.getElementById('accessKey').value.trim(),
}, document.getElementById('errKey'), document.getElementById('btnKey'));
// 回车提交
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnPwd').click(); });
document.getElementById('accessKey').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnKey').click(); });
</script>
</body>
</html>
