name: Verify LUMENIS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development/test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources (BLOCKING)
        # A real SyntaxError is a production blocker and must fail CI.
        run: python -m compileall -q .

      - name: Run pytest non-browser subset (BLOCKING)
        # Browser/CDP and real-network tests are exercised by their own runtime/E2E gates.
        # Collection errors are blocking here; do not hide them with --continue-on-collection-errors.
        timeout-minutes: 15
        run: |
          python -m pytest tests/ \
            -m "not online" \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_browser_e2e.py \
            --ignore=tests/test_browser_hybrid.py \
            --ignore=tests/test_browser_runtime_resident.py \
            --ignore=tests/test_browser_surface.py \
            --ignore=tests/test_browser_downloads.py \
            --ignore=tests/test_internal_browser_recovery.py \
            --ignore=tests/test_collector_e2e_four_layer.py \
            --ignore=tests/test_dual_domain_e2e.py \
            --ignore=tests/browser_runtime \
            -q --tb=line

      - name: Boundary Check (ADVISORY)
        # Governance signal until violations are classified into explicit blocking/advisory policy.
        continue-on-error: true
        run: python scripts/audit_tools/boundary_check.py --ci

      - name: Asset Impact Scan (INFORMATIONAL)
        # Repository inventory signal; failure is reported but does not currently block release.
        continue-on-error: true
        run: python scripts/audit_tools/asset_impact_scan.py
