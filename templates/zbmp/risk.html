{% extends "base.html" %}
{% block title %}Risk · 序境 LUMENIS{% endblock %}
{% block page_title %}Risk{% endblock %}

{% block topbar_actions %}
<select class="zbc-btn" id="risk-brand-filter" aria-label="品牌筛选" style="cursor:pointer;">
  <option value="">全部品牌</option>
</select>
<select class="zbc-btn" id="risk-level-filter" aria-label="风险等级筛选" style="cursor:pointer;">
  <option value="">全部等级</option>
  <option value="critical">Critical</option>
  <option value="high">High</option>
  <option value="medium">Medium</option>
  <option value="low">Low</option>
  <option value="unknown">Unknown</option>
</select>
{% endblock %}

{% block content %}
<!-- Degraded Banner -->
<div class="zbc-degraded-banner" id="degraded-banner" style="display:none;">
  <span>⚠</span><span id="degraded-msg">部分数据延迟，已加载数据正常显示</span>
</div>

<!-- 3 KPI Cards (xjViz.kpi 函数驱动) -->
<div class="zbc-kpi-grid">
  <div class="zbc-kpi-card zbc-kpi-card--gradient-zbmp"><div id="kpi-pending"></div></div>
  <div class="zbc-kpi-card"><div id="kpi-week-new"></div></div>
  <div class="zbc-kpi-card"><div id="kpi-resolved"></div></div>
</div>

<!-- Risk List Table -->
<div class="zbc-card" id="risk-list-card">
  <div class="zbc-card__header">
    <span class="zbc-card__title">风险事件列表</span>
    <span class="zbc-tag zbc-tag--info" id="risk-count-tag">0 条</span>
  </div>
  <div class="zbc-card__body" style="padding:0;">
    <!-- Loading -->
    <div class="zbc-state-loading" id="risk-loading">
      <div class="zbc-skeleton" style="width:100%;height:44px;margin-bottom:8px;"></div>
      <div class="zbc-skeleton" style="width:100%;height:44px;margin-bottom:8px;"></div>
      <div class="zbc-skeleton" style="width:100%;height:44px;margin-bottom:8px;"></div>
      <div class="zbc-skeleton" style="width:100%;height:44px;"></div>
    </div>
    <!-- Empty -->
    <div class="zbc-state-empty" id="risk-empty" style="display:none;">
      <div class="zbc-state-empty__icon">🛡</div>
      <div class="zbc-state-empty__text">暂无风险事件</div>
      <button class="zbc-btn zbc-btn--primary" onclick="ZBMPRisk.load()" type="button">刷新</button>
    </div>
    <!-- Error -->
    <div class="zbc-state-error" id="risk-error" style="display:none;">
      <div class="zbc-state-error__text" id="risk-error-msg">加载失败</div>
      <button class="zbc-btn zbc-btn--primary" onclick="ZBMPRisk.load()" type="button">重试</button>
    </div>
    <!-- Success: Table -->
    <div id="risk-table-wrap" style="display:none;overflow-x:auto;">
      <table class="zbc-table" id="risk-table">
        <thead>
          <tr>
            <th style="width:60px;">等级</th>
            <th>风险标题</th>
            <th>品牌</th>
            <th>来源</th>
            <th>发现时间</th>
            <th>状态</th>
            <th style="width:100px;">操作</th>
          </tr>
        </thead>
        <tbody id="risk-tbody"></tbody>
      </table>
    </div>
  </div>
  <!-- Pagination -->
  <div class="zbc-card__body" id="risk-pagination" style="display:none;padding:12px 20px;border-top:1px solid var(--l-border-light,#F0F0F0);justify-content:space-between;align-items:center;">
    <span style="font-size:12px;color:var(--l-text-secondary,#6B7280);" id="risk-page-info">共 0 条</span>
    <div style="display:flex;gap:8px;">
      <button class="zbc-btn" id="risk-prev" type="button" style="padding:4px 12px;">上一页</button>
      <button class="zbc-btn" id="risk-next" type="button" style="padding:4px 12px;">下一页</button>
    </div>
  </div>
</div>

<!-- Risk Detail Modal -->
<div id="risk-detail-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:var(--z-modal);display:none;align-items:center;justify-content:center;padding:24px;">
  <div class="zbc-card" style="width:100%;max-width:800px;max-height:85vh;overflow-y:auto;">
    <div class="zbc-card__header">
      <span class="zbc-card__title" id="detail-title">风险详情</span>
      <button class="zbc-icon-btn" id="detail-close" type="button" style="width:28px;height:28px;font-size:16px;">✕</button>
    </div>
    <div class="zbc-card__body" id="detail-body">
      <div class="zbc-state-loading"><div class="zbc-skeleton" style="width:100%;height:200px;"></div></div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var ZBMPRisk = {
    state: { risks: [], filtered: [], total: 0, page: 1, perPage: 20, totalPages: 1, brand: '', level: '', currentRisk: null },

    LEVEL_CONFIG: {
      critical: { label: 'Critical', cls: 'zbc-tag--high', color: '#DC2626' },
      high: { label: 'High', cls: 'zbc-tag--high', color: '#DC2626' },
      medium: { label: 'Medium', cls: 'zbc-tag--medium', color: '#D97706' },
      low: { label: 'Low', cls: 'zbc-tag--low', color: '#10B981' },
      unknown: { label: 'Unknown', cls: 'zbc-tag--unknown', color: '#6B7280' }
    },

    init: function() {
      var self = this;
      // Brand filter
      var bf = document.getElementById('risk-brand-filter');
      if (bf) bf.addEventListener('change', function() { self.state.brand = bf.value; self.state.page = 1; self.applyFilters(); });
      // Level filter
      var lf = document.getElementById('risk-level-filter');
      if (lf) lf.addEventListener('change', function() { self.state.level = lf.value; self.state.page = 1; self.applyFilters(); });
      // Pagination
      var rp = document.getElementById('risk-prev');
      var rn = document.getElementById('risk-next');
      if (rp) rp.addEventListener('click', function() { if (self.state.page > 1) { self.state.page--; self.renderTable(); } });
      if (rn) rn.addEventListener('click', function() { if (self.state.page < self.state.totalPages) { self.state.page++; self.renderTable(); } });
      // Modal close
      var dc = document.getElementById('detail-close');
      if (dc) dc.addEventListener('click', function() { self.closeDetail(); });
      var modal = document.getElementById('risk-detail-modal');
      if (modal) modal.addEventListener('click', function(e) { if (e.target === modal) self.closeDetail(); });

      this.loadBrands();
      this.load();
    },

    loadBrands: function() {
      var self = this;
      xjViz.api('/brand-industry/brands', {limit:100})
        .then(function(d) {
          if (!d || !d.brands) return;
          var bf = document.getElementById('risk-brand-filter');
          if (!bf) return;
          d.brands.forEach(function(b) {
            var name = b.brand_name_cn || b.brand_name || b.name;
            if (name) {
              var opt = document.createElement('option');
              opt.value = name;
              opt.textContent = name;
              bf.appendChild(opt);
            }
          });
        })
        .catch(function() {});
    },

    showState: function(state) {
      var map = { loading: 'risk-loading', empty: 'risk-empty', error: 'risk-error', success: 'risk-table-wrap' };
      ['loading','empty','error'].forEach(function(s) {
        var el = document.getElementById(map[s]);
        if (el) el.style.display = (s === state) ? '' : 'none';
      });
      document.getElementById('risk-table-wrap').style.display = (state === 'success') ? '' : 'none';
      var pag = document.getElementById('risk-pagination');
      if (pag) pag.style.display = (state === 'success') ? 'flex' : 'none';
    },

    _kpi: function(sel, label, value, sub) {
      var el = document.querySelector(sel);
      if (!el) return;
      if (value == null || isNaN(value) || value === '') {
        el.innerHTML = '<div style="font-size:11px;font-weight:500;color:var(--l-text-secondary,#6B7280);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;">' + label + '</div><div style="font-size:24px;font-weight:700;color:var(--l-text-tertiary,#9CA3AF);">—</div><div style="font-size:11px;color:var(--l-text-tertiary,#9CA3AF);margin-top:6px;">数据采集中</div>';
      } else {
        xjViz.kpi(sel, label, value, { sub: sub || '' });
      }
    },

    load: function() {
      var self = this;
      this.showState('loading');

      // xjViz.api 已包装 LUMENIS.fetch，自动带认证
      xjViz.api('/negative/pending', {per_page:100, status:'pending'})
        .then(function(d) {
          if (d.ok === false) throw new Error(d.error || 'API error');
          var risks = d.notes || d.items || [];
          self.state.risks = risks;
          self.state.filtered = risks.slice();
          self.state.total = d.total || risks.length;
          self.state.totalPages = Math.max(1, Math.ceil(self.state.total / self.state.perPage));
          self.renderKPIs(risks);
          self.applyFilters();
          self.loadAlerts();
        })
        .catch(function(e) {
          if (e.message && e.message.indexOf('403') >= 0) {
            self.showState('empty');
            document.getElementById('risk-empty').innerHTML = '<div class="zbc-state-empty__icon">🔒</div><div class="zbc-state-empty__text">无权限访问风险数据</div>';
            return;
          }
          // Fallback to /risks/active
          xjViz.api('/risks/active', {limit:100})
            .then(function(d2) {
              var risks = d2.risks || d2.notes || [];
              self.state.risks = risks;
              self.state.filtered = risks.slice();
              self.state.total = d2.total || risks.length;
              self.state.totalPages = Math.max(1, Math.ceil(self.state.total / self.state.perPage));
              self.renderKPIs(risks);
              self.showDegraded('负面审核接口延迟，已加载活跃风险列表');
              self.applyFilters();
            })
            .catch(function(e2) {
              document.getElementById('risk-error-msg').textContent = e.message || e2.message || '加载失败';
              self.showState('error');
            });
        });
    },

    loadAlerts: function() {
      var self = this;
      xjViz.api('/alerts', {unread:0})
        .then(function(d) {
          if (!d || !d.alerts) return;
          var alerts = d.alerts || [];
          var weekAgo = new Date();
          weekAgo.setDate(weekAgo.getDate() - 7);
          var weekNew = alerts.filter(function(a) {
            var t = new Date(a.created_at || a.timestamp || 0);
            return t >= weekAgo;
          }).length;
          self._kpi('#kpi-week-new', '本周新增', weekNew > 0 ? weekNew : null, '近7天');
        })
        .catch(function() {});
    },

    showDegraded: function(msg) {
      var banner = document.getElementById('degraded-banner');
      if (banner) { banner.style.display = 'flex'; document.getElementById('degraded-msg').textContent = msg; }
    },

    renderKPIs: function(risks) {
      // 使用 xjViz.fn.FN_RISK_COUNT 标准化风险统计
      var riskStats = xjViz.fn.FN_RISK_COUNT({ stats: {
        pending: risks.filter(function(r) { return r.negative_confirmed === 0 || r.negative_confirmed == null; }).length,
        confirmed: risks.filter(function(r) { return r.negative_confirmed === 1; }).length,
        rejected: risks.filter(function(r) { return r.negative_confirmed === 2; }).length
      }});
      this._kpi('#kpi-pending', '待处理风险', riskStats.pending > 0 ? riskStats.pending : null, '待审核');
      this._kpi('#kpi-resolved', '已解决', riskStats.rejected > 0 ? riskStats.rejected : null, '已驳回/已处理');
      document.getElementById('risk-count-tag').textContent = this.state.total + ' 条';
    },

    applyFilters: function() {
      var self = this;
      var brand = this.state.brand;
      var level = this.state.level;
      this.state.filtered = this.state.risks.filter(function(r) {
        var matchBrand = !brand || (r.title && r.title.indexOf(brand) >= 0) || (r.author_nickname && r.author_nickname.indexOf(brand) >= 0);
        var rLevel = r.risk_level || 'unknown';
        var matchLevel = !level || rLevel === level;
        return matchBrand && matchLevel;
      });
      this.state.totalPages = Math.max(1, Math.ceil(this.state.filtered.length / this.state.perPage));
      if (this.state.page > this.state.totalPages) this.state.page = this.state.totalPages;
      this.renderTable();
    },

    renderTable: function() {
      var self = this;
      var start = (this.state.page - 1) * this.state.perPage;
      var pageData = this.state.filtered.slice(start, start + this.state.perPage);

      if (pageData.length === 0) {
        this.showState('empty');
        return;
      }
      this.showState('success');

      var tbody = document.getElementById('risk-tbody');
      tbody.innerHTML = '';
      pageData.forEach(function(r) {
        var tr = document.createElement('tr');
        var level = (r.risk_level || 'unknown').toLowerCase();
        var cfg = self.LEVEL_CONFIG[level] || self.LEVEL_CONFIG.unknown;
        var title = r.title || '无标题风险事件';
        var brand = r.author_nickname || r.brand_name || '—';
        var source = r.source_platform || 'unknown';
        var time = r.collected_at || r.publish_date || '—';
        var status = r.negative_confirmed === 1 ? '已确认' : (r.negative_confirmed === 2 ? '已驳回' : '待处理');
        var statusCls = status === '已确认' ? 'zbc-tag--high' : (status === '已驳回' ? 'zbc-tag--low' : 'zbc-tag--medium');
        var noteId = r.note_id || r.id || '';

        tr.innerHTML =
          '<td><span class="zbc-tag ' + cfg.cls + '" style="font-weight:600;">' + cfg.label + '</span></td>' +
          '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;" title="' + self.escapeHtml(title) + '">' + self.escapeHtml(title) + '</td>' +
          '<td style="font-size:12px;">' + self.escapeHtml(brand) + '</td>' +
          '<td><span class="zbc-tag zbc-tag--info" style="font-size:10px;">' + self.escapeHtml(source) + '</span></td>' +
          '<td style="font-size:12px;color:var(--l-text-secondary,#6B7280);">' + time + '</td>' +
          '<td><span class="zbc-tag ' + statusCls + '">' + status + '</span></td>' +
          '<td><button class="zbc-btn" style="padding:2px 8px;font-size:11px;margin-right:4px;" onclick="ZBMPRisk.showDetail(\'' + noteId + '\')" type="button">详情</button>' +
          '<button class="zbc-btn" style="padding:2px 8px;font-size:11px;" onclick="ZBMPRisk.confirmRisk(\'' + noteId + '\')" type="button">确认</button></td>';
        tbody.appendChild(tr);
      });

      document.getElementById('risk-page-info').textContent =
        '共 ' + this.state.filtered.length + ' 条 · 第 ' + this.state.page + '/' + this.state.totalPages + ' 页';
      document.getElementById('risk-prev').disabled = this.state.page <= 1;
      document.getElementById('risk-next').disabled = this.state.page >= this.state.totalPages;
    },

    showDetail: function(noteId) {
      var self = this;
      var modal = document.getElementById('risk-detail-modal');
      modal.style.display = 'flex';
      document.getElementById('detail-body').innerHTML = '<div class="zbc-state-loading"><div class="zbc-skeleton" style="width:100%;height:200px;"></div></div>';

      // Find risk in local data first
      var risk = this.state.risks.find(function(r) { return (r.note_id || r.id) === noteId; });
      if (risk) {
        this.state.currentRisk = risk;
        this.renderDetail(risk);
        return;
      }

      // Fetch note detail
      xjViz.api('/notes/' + encodeURIComponent(noteId))
        .then(function(d) {
          var note = d.note || d.data || d;
          self.state.currentRisk = note;
          self.renderDetail(note);
        })
        .catch(function(e) {
          document.getElementById('detail-body').innerHTML = '<div class="zbc-state-error"><div class="zbc-state-error__text">加载详情失败：' + self.escapeHtml(e.message || '未知错误') + '</div></div>';
        });
    },

    renderDetail: function(risk) {
      var level = (risk.risk_level || 'unknown').toLowerCase();
      var cfg = this.LEVEL_CONFIG[level] || this.LEVEL_CONFIG.unknown;
      var title = risk.title || '无标题';
      var eng = (risk.likes||0) + (risk.comments||0) + (risk.collects||0) + (risk.shares||0);

      var html = '';
      // Basic info
      html += '<div style="margin-bottom:20px;">';
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span class="zbc-tag ' + cfg.cls + '" style="font-weight:600;">' + cfg.label + '</span><span class="zbc-tag zbc-tag--info">' + this.escapeHtml(risk.source_platform || 'unknown') + '</span></div>';
      html += '<h3 style="font-size:16px;font-weight:600;margin-bottom:8px;">' + this.escapeHtml(title) + '</h3>';
      if (risk.summary || risk.body) {
        html += '<p style="font-size:13px;color:var(--l-text-secondary,#6B7280);line-height:1.6;">' + this.escapeHtml(risk.summary || risk.body || '') + '</p>';
      }
      html += '<div style="display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--l-text-secondary,#6B7280);">';
      html += '<span>作者：' + this.escapeHtml(risk.author_nickname || '—') + '</span>';
      html += '<span>互动：' + eng + '</span>';
      html += '<span>发现：' + (risk.collected_at || risk.publish_date || '—') + '</span>';
      html += '</div></div>';

      // Event Timeline
      html += '<div style="margin-bottom:20px;"><h4 style="font-size:13px;font-weight:600;margin-bottom:12px;">事件时间线</h4>';
      html += '<div style="position:relative;padding-left:20px;">';
      html += '<div style="position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--l-border,#E8E8E8);"></div>';
      html += '<div style="position:relative;margin-bottom:12px;"><div style="position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:#0F766E;"></div><div style="font-size:12px;font-weight:500;">采集发现</div><div style="font-size:11px;color:var(--l-text-tertiary,#9CA3AF);">' + (risk.collected_at || '—') + '</div></div>';
      html += '<div style="position:relative;margin-bottom:12px;"><div style="position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:#D97706;"></div><div style="font-size:12px;font-weight:500;">风险评级：' + cfg.label + '</div><div style="font-size:11px;color:var(--l-text-tertiary,#9CA3AF);">风险分：' + (risk.risk_score || '—') + '</div></div>';
      if (risk.negative_confirmed === 1) {
        html += '<div style="position:relative;"><div style="position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:#DC2626;"></div><div style="font-size:12px;font-weight:500;">已确认为负面</div></div>';
      } else if (risk.negative_confirmed === 2) {
        html += '<div style="position:relative;"><div style="position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:#10B981;"></div><div style="font-size:12px;font-weight:500;">已驳回（非负面）</div></div>';
      } else {
        html += '<div style="position:relative;"><div style="position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:#9CA3AF;"></div><div style="font-size:12px;font-weight:500;">待人工审核</div></div>';
      }
      html += '</div></div>';

      // AI Judgment
      html += '<div style="margin-bottom:20px;"><h4 style="font-size:13px;font-weight:600;margin-bottom:8px;">AI 研判</h4>';
      html += '<div style="background:var(--l-bg-secondary,#F7F7F8);border-radius:8px;padding:12px;font-size:12px;line-height:1.6;color:var(--l-text-secondary,#6B7280);">';
      html += '情感倾向：' + (risk.sentiment || 'unknown') + ' · 风险等级：' + cfg.label + ' · 风险分：' + (risk.risk_score || '—') + '<br>';
      html += '建议：' + (level === 'critical' || level === 'high' ? '建议立即处理，启动危机响应流程' : (level === 'medium' ? '建议关注，24小时内跟进' : '低风险，常规监控即可'));
      html += '</div></div>';

      // Evidence Chain
      html += '<div><h4 style="font-size:13px;font-weight:600;margin-bottom:8px;">证据链</h4>';
      html += '<div style="font-size:12px;line-height:1.8;">';
      if (risk.url) {
        html += '<div>原文链接：<button type="button" class="zbc-btn js-open-evidence" '
          + 'data-url="' + this.escapeHtml(risk.url) + '" '
          + 'style="padding:2px 8px;color:#0F766E;">在序境浏览器打开</button>';
        html += '<div style="font-family:monospace;font-size:11px;color:var(--l-text-tertiary,#9CA3AF);word-break:break-all;margin-top:4px;">'
          + this.escapeHtml(risk.url) + '</div></div>';
      }
      html += '<div>笔记ID：<code style="font-family:monospace;font-size:11px;">' + (risk.note_id || risk.id || '—') + '</code></div>';
      html += '<div>采集来源：' + this.escapeHtml(risk.source_platform || 'unknown') + '</div>';
      html += '</div></div>';

      // Actions
      html += '<div style="margin-top:20px;display:flex;gap:8px;border-top:1px solid var(--l-border-light,#F0F0F0);padding-top:16px;">';
      html += '<button class="zbc-btn zbc-btn--primary" onclick="ZBMPRisk.confirmRisk(\'' + (risk.note_id || risk.id || '') + '\')" type="button">确认负面</button>';
      html += '<button class="zbc-btn" onclick="ZBMPRisk.rejectRisk(\'' + (risk.note_id || risk.id || '') + '\')" type="button">驳回</button>';
      html += '</div>';

      document.getElementById('detail-body').innerHTML = html;
      document.getElementById('detail-title').textContent = '风险详情 · ' + cfg.label;
      document.querySelectorAll('#detail-body .js-open-evidence').forEach(function (button) {
        button.addEventListener('click', function () {
          if (window.BrowserPanel && typeof window.BrowserPanel.navigate === 'function') {
            window.BrowserPanel.navigate(button.getAttribute('data-url') || '');
          }
        });
      });
    },

    closeDetail: function() {
      document.getElementById('risk-detail-modal').style.display = 'none';
      this.state.currentRisk = null;
    },

    confirmRisk: function(noteId) {
      if (!noteId) return;
      LUMENIS.fetch('/api/negative/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note_id: noteId })
      })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d) {
        alert('已确认为负面');
        ZBMPRisk.closeDetail();
        ZBMPRisk.load();
      })
      .catch(function(e) { alert('确认失败：' + (e.message || '未知错误')); });
    },

    rejectRisk: function(noteId) {
      if (!noteId) return;
      LUMENIS.fetch('/api/negative/reject', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note_id: noteId })
      })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d) {
        alert('已驳回');
        ZBMPRisk.closeDetail();
        ZBMPRisk.load();
      })
      .catch(function(e) { alert('驳回失败：' + (e.message || '未知错误')); });
    },

    escapeHtml: function(str) {
      if (str == null) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  };

  window.ZBMPRisk = ZBMPRisk;
  document.addEventListener('DOMContentLoaded', function() { ZBMPRisk.init(); });
})();
</script>
{% endblock %}
