{% extends "base.html" %}

{% block title %}舆情事件 - 广州太古汇舆情监测系统{% endblock %}

{% block content %}
<div class="events-page">
    <section class="events-section">
        <div class="section-header">
            <h2 class="section-title">舆情事件</h2>
            <div class="filter-bar">
                <select id="event-risk-filter">
                    <option value="">全部风险等级</option>
                    <option value="critical">🔴 重大</option>
                    <option value="high">🟠 高风险</option>
                    <option value="medium">🟡 中风险</option>
                    <option value="low">🟢 低风险</option>
                </select>
                <select id="event-status-filter">
                    <option value="">全部状态</option>
                    <option value="active">进行中</option>
                    <option value="resolved">已解决</option>
                    <option value="monitoring">监测中</option>
                </select>
                <input type="date" id="event-start-date" placeholder="开始日期" />
                <input type="date" id="event-end-date" placeholder="结束日期" />
                <button class="btn btn-primary" onclick="searchEvents()">搜索</button>
            </div>
        </div>

        <div class="events-stats">
            <span>总计: <strong id="events-total">0</strong> 个</span>
            <span>进行中: <strong id="events-active">0</strong> 个</span>
            <span>高风险: <strong id="events-high">0</strong> 个</span>
            <span>本周新增: <strong id="events-week">0</strong> 个</span>
        </div>

        <div class="events-list" id="events-list">
            <div class="loading">加载中...</div>
        </div>

        <div class="pagination" id="events-pagination">
            <button class="btn btn-secondary" onclick="prevPage()">上一页</button>
            <span id="page-info">第 1 页</span>
            <button class="btn btn-secondary" onclick="nextPage()">下一页</button>
        </div>
    </section>
</div>

<!-- 事件详情弹窗 -->
<div id="event-detail-modal" class="modal" style="display:none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h3 id="event-detail-title">事件详情</h3>
            <button class="modal-close" onclick="closeEventDetail()">×</button>
        </div>
        <div class="modal-body" id="event-detail-content">
            <div class="loading">加载中...</div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" onclick="viewEventNotes()">查看相关笔记</button>
            <button class="btn btn-secondary" onclick="closeEventDetail()">关闭</button>
        </div>
    </div>
</div>
{% endblock %}
