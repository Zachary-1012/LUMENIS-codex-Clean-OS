          PY

      - name: Prepare official Chromium fixture runtime (EXECUTION-LAYER)
        timeout-minutes: 4
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/oevira-playwright
        run: |
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()"

      - name: Test real Chromium in offline namespace (BLOCKING)
        timeout-minutes: 3
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/oevira-playwright
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # New network namespace has no external interfaces. Drop back to the
          # runner user; do not change host network/security settings or permit
          # a fallback to online execution when namespace creation fails.
          sudo unshare --net -- runuser -u "$(id -un)" -- env \
            PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" RUNNER_TEMP="$RUNNER_TEMP" \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1 \
            "$(command -v python)" - <<'PY'
          import os, pathlib, tempfile, subprocess, sys, importlib.metadata
          from playwright.sync_api import sync_playwright
          root = pathlib.Path(tempfile.mkdtemp(prefix='oevira-chromium-regression-'))
          for key in list(os.environ):
              if key.startswith(('ZBC_', 'TAIKOO_', 'XHS_', 'LUMENIS_', 'AI_', 'OPENAI_', 'ANTHROPIC_', 'ZHIPU_')):
                  os.environ.pop(key, None)
          with sync_playwright() as pw:
              executable = pw.chromium.executable_path
          print('PYTHON:', sys.version)
          print('PLAYWRIGHT:', importlib.metadata.version('playwright'))
          print('CHROMIUM:', subprocess.check_output([executable, '--version'], text=True).strip())
          print('SOURCE_HEAD:', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          print('SOURCE_TREE:', subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip())
          os.environ.update(ZBC_DB_PATH=str(root/'seed.sqlite3'), ZBC_DATA_DIR=str(root),
              LUMENIS_TEST_SEED_DB=str(root/'seed.sqlite3'), ZBC_TEST_OFFLINE='1',
              LUMENIS_TEST_REAL_BROWSER='1', LUMENIS_TEST_CHROMIUM_EXECUTABLE=executable,
              XHS_PRODUCTION='0', ZBC_PREFLIGHT_ENFORCE='0', ZBC_GUARDIAN_ENABLED='0')
          import sqlite3
          from lumenis.shared.database import apply_business_schema
          connection = sqlite3.connect(root/'seed.sqlite3')
          try:
              apply_business_schema(connection)
              connection.commit()
          finally:
              connection.close()
          import pytest
          raise SystemExit(pytest.main(['-vv', '--tb=short', '-p', 'no:cacheprovider',
              '--junitxml=' + os.path.join(os.environ['RUNNER_TEMP'], 'oevira-browser.xml'),
              'tests/test_browser_extract.py::test_real_chromium_visible_capture_without_network',
              'tests/test_collector_public_browser.py::PublicBrowserBoundaryTests::test_installed_runtime_visible_native_read_and_original_custody',
              'tests/test_collector_public_browser.py::PublicBrowserBoundaryTests::test_denial_and_private_subrequests_stop_without_backend_switch']))
          PY

      - name: Preserve real fixture XML receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oevira-real-fixture-receipts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oevira-offline.log
            ${{ runner.temp }}/oevira-offline.xml
            ${{ runner.temp }}/oevira-http.xml
            ${{ runner.temp }}/oevira-browser.xml
            ${{ runner.temp }}/oevira-candidates.xml
            ${{ runner.temp }}/oevira-owned-http.xml
          if-no-files-found: error
          retention-days: 14

      - name: Record gate scope (INFORMATIONAL)
        if: ${{ always() }}
        run: |
          echo "Authorized isolated unit/integration regressions are blocking engineering evidence; actual execution status is recorded above."
          echo "Historical failures remain failed; real E2E and user acceptance require separate actual evidence."
          echo "This source/runtime-prerequisite gate alone does not close a user job or release."

      - name: Boundary Check (BLOCKING)
        if: ${{ always() }}
        run: python scripts/audit_tools/boundary_check.py --ci
