name: LUMENIS Product Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumenis-product-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: production truth + hermetic platform verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate four-product contract and LUMENIS authority (BLOCKING)
        run: >-
          python scripts/audit_tools/verify_lumenis_ggi_contract.py
          00-GOVERNANCE/LUMENIS-GGI-CROSS-PRODUCT-CONTRACT-V1.json

      - name: Validate Codex takeover governance consistency (BLOCKING)
        run: python scripts/audit_tools/verify_codex_takeover_governance.py

      - name: Validate Only-One App-first product architecture (BLOCKING)
        run: python scripts/audit_tools/verify_lumenis_single_product.py

      - name: Validate sole Experience design authority (BLOCKING)
        run: python scripts/audit_tools/verify_experience_authority_exclusive.py

      - name: Validate App-only Experience anti-template contract (BLOCKING)
        shell: bash
        run: |
          mode="--baseline"
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          if echo "$changed" | grep -Eq '^(app/lib/|app/pubspec.yaml|00-GOVERNANCE/LUMENIS-EXPERIENCE-CONSTITUTION.md)'; then
            mode="--strict"
            echo "Canonical Flutter Experience changed; strict App-only gate required."
          else
            echo "Canonical Flutter Experience unchanged; enforcing App-only baseline."
          fi
          python scripts/audit_tools/verify_experience_anti_template.py "$mode"

      - name: Compile tracked Python sources (BLOCKING)
        shell: bash
        run: |
          python_files="$(git ls-files '*.py' | wc -l | xargs)"
          test "$python_files" -gt 0
          echo "Compiling ${python_files} tracked Python files"
          git ls-files -z '*.py' | xargs -0 -r -n 120 python -m py_compile

      - name: Validate CI test-tier manifests (BLOCKING)
        shell: bash
        run: |
          missing=0
          while IFS='|' read -r raw_path reason; do
            path="$(echo "$raw_path" | xargs)"
            [[ -z "$path" || "$path" == \#* ]] && continue
            if [[ ! -e "$path" ]]; then
              echo "Missing environment-tier path: $path"
              missing=1
            fi
          done < tests/ci_environment_tests.txt

          while IFS='|' read -r raw_node reason; do
            node="$(echo "$raw_node" | xargs)"
            [[ -z "$node" || "$node" == \#* ]] && continue
            file="${node%%::*}"
            if [[ ! -f "$file" ]]; then
              echo "Missing quarantined-node file: $file"
              missing=1
            fi
          done < tests/ci_quarantined_nodeids.txt

          python tests/select_ci_tests.py > /tmp/lumenis-hermetic-tests.txt
          selected_count="$(wc -l < /tmp/lumenis-hermetic-tests.txt | xargs)"
          if [[ "$selected_count" -lt 1 ]]; then
            echo "Hermetic selector produced no tests"
            missing=1
          fi
          echo "Hermetic test files selected: $selected_count"
          exit "$missing"

      - name: Install development/test dependencies (EXECUTION-LAYER)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --retries 4 --timeout 30 -r requirements-dev.txt

      - name: Credential-path boundary diagnostic (INFORMATIONAL)
        shell: bash
        run: |
          python - <<'PY'
          import data_boundary
          result = data_boundary.assert_no_tracked_credentials('.')
          print('status:', result['status'])
          print('tracked_total:', result['tracked_total'])
          print('leak_count:', len(result['leaks']))
          for path in result['leaks']:
              print('tracked-boundary-path:', path)
          PY

      - name: Run clean-checkout hermetic pytest (BLOCKING)
        shell: bash
        timeout-minutes: 15
        run: |
          mapfile -t test_files < <(python tests/select_ci_tests.py)

          deselect_args=()
          while IFS='|' read -r raw_node reason; do
            node="$(echo "$raw_node" | xargs)"
            [[ -z "$node" || "$node" == \#* ]] && continue
            deselect_args+=("--deselect=$node")
          done < tests/ci_quarantined_nodeids.txt

          echo "Running ${#test_files[@]} hermetic test files"
          python -m pytest \
            "${test_files[@]}" \
            -m "not online" \
            "${deselect_args[@]}" \
            -q --tb=line

      - name: Production/live and quarantine inventory (INFORMATIONAL)
        if: ${{ always() }}
        shell: bash
        run: |
          echo "=== Environment / Production-Live suites ==="
          cat tests/ci_environment_tests.txt
          echo "=== Exact quarantined nodeids ==="
          cat tests/ci_quarantined_nodeids.txt

      - name: Boundary Check (ADVISORY)
        if: ${{ always() }}
        continue-on-error: true
        run: python scripts/audit_tools/boundary_check.py --ci

      - name: Asset Impact Scan (INFORMATIONAL)
        if: ${{ always() }}
        continue-on-error: true
        run: python scripts/audit_tools/asset_impact_scan.py