name: Isolated function-audit parser tools
on:
  push:
    branches: [audit/20261010-current-code-convergence]
    paths: [.github/workflows/audit-parser-tools-20261011.yml]
permissions:
  contents: read
jobs:
  tooling:
    if: github.repository == 'Zachary-1012/LUMENIS-codex-Clean-OS' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download audit-only wheels; do not import any product code
        timeout-minutes: 3
        run: |
          mkdir wheels
          python -m pip download --disable-pip-version-check --timeout 20 --retries 2 --only-binary=:all: --dest wheels 'tree-sitter-language-pack==0.13.0' 'tree-sitter==0.25.2' 'Flask==3.1.2'
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('wheels')
          rows=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.glob('*.whl'))]
          (root/'manifest.json').write_text(json.dumps({'audit_only':True,'product_dependencies_changed':False,'wheels':rows},indent=2))
          print(json.dumps({'wheels':len(rows),'product_runtime_started':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audit-only-parser-tools-cp313
          path: wheels/*
          retention-days: 3
          if-no-files-found: error
