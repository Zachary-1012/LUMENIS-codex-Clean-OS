name: Python scope audit (not product acceptance)
on:
  push:
    branches: [audit/20261010-current-code-convergence]
    paths: [.github/workflows/python-scope-audit-20261010.yml]
permissions:
  contents: read
jobs:
  scopes:
    if: github.repository == 'Zachary-1012/LUMENIS-codex-Clean-OS' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: source
          ref: 01588e9fd9568e3fcaf1e6c3d957bc498436fa48
          persist-credentials: false
      - name: Install audit-only checker with verified hash
        run: |
          printf 'pyflakes==3.4.0 --hash=sha256:f742a7dbd0d9cb9ea41e9a24a918996e8170c799fa528688d40dd582c8265f4f\n' > audit-requirements.txt
          python3 -m pip install --disable-pip-version-check --retries 2 --timeout 20 --require-hashes --only-binary=:all: -r audit-requirements.txt
      - name: Lexical analysis of every tracked Python source
        timeout-minutes: 2
        run: |
          python3 -I - <<'PY'
          import ast,pathlib,json,subprocess,warnings,collections
          from pyflakes.checker import Checker
          root=pathlib.Path('source');out=pathlib.Path('scope-review');out.mkdir()
          paths=subprocess.check_output(['git','-C',str(root),'ls-files','-z','*.py'],timeout=15).decode().split('\0')
          rows=[];files=[]
          for name in paths:
              if not name:continue
              text=(root/name).read_text('utf-8-sig')
              try:
                  with warnings.catch_warnings():
                      warnings.simplefilter('ignore'); tree=ast.parse(text,filename=name)
                  result=Checker(tree,filename=name)
                  for m in result.messages:
                      rows.append({'path':name,'line':m.lineno,'column':m.col,'kind':type(m).__name__,'message':m.message % m.message_args})
                  files.append({'path':name,'analyzed':True,'messages':len(result.messages)})
              except Exception as e:
                  files.append({'path':name,'analyzed':False,'reason':type(e).__name__})
          (out/'scope_diagnostics.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          (out/'scope_files.json').write_text(json.dumps(files,ensure_ascii=False,indent=2))
          summary={'baseline':'01588e9fd9568e3fcaf1e6c3d957bc498436fa48','checker':'pyflakes 3.4.0','files':len(files),'analyzed':sum(f['analyzed'] for f in files),'messages':dict(collections.Counter(r['kind'] for r in rows)),'product_execution':False}
          (out/'scope_summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-python-scope-diagnostics
          path: scope-review/*
          retention-days: 1
          if-no-files-found: error
