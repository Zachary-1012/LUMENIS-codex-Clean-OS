{% extends "base.html" %}
{% block title %}微博状态 · 序境 LUMENIS{% endblock %}
{% block page_title %}微博状态{% endblock %}

{% block content %}
<div class="lm-viewport" data-domain="cth">
  <div class="lm-viewport__context">
    <div class="lm-section-header" style="margin:0;">
      <div class="lm-section-header__title">微博平台状态</div>
    </div>
    <p class="lm-section-header__desc" style="color:var(--lm-color-text-secondary);margin:4px 0 0;">微博采集账号登录状态 · Cookie 管理 · 合规只读</p>
  </div>

  <!-- 状态卡片 -->
  <div id="status-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0;">
    <div class="lm-kpi-card"><div class="lm-kpi-card__label">登录状态</div><div class="lm-kpi-card__value" id="status-login">—</div></div>
    <div class="lm-kpi-card"><div class="lm-kpi-card__label">Cookie 数量</div><div class="lm-kpi-card__value" id="status-cookies">—</div></div>
    <div class="lm-kpi-card"><div class="lm-kpi-card__label">Profile</div><div class="lm-kpi-card__value" id="status-profile">—</div></div>
    <div class="lm-kpi-card"><div class="lm-kpi-card__label">最后检查</div><div class="lm-kpi-card__value" id="status-lastcheck" style="font-size:13px;">—</div></div>
  </div>

  <!-- 操作按钮 -->
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button class="lm-btn lm-btn--primary" onclick="checkLogin()">检查登录状态</button>
    <button class="lm-btn lm-btn--ghost" onclick="startLogin()">开始登录流程</button>
    <button class="lm-btn lm-btn--ghost" onclick="clearLogin()">清除登录</button>
    <button class="lm-btn lm-btn--ghost" onclick="toggleRaw()">查看原始JSON</button>
  </div>

  <!-- 消息提示 -->
  <div id="status-msg" style="padding:10px 14px;border-radius:8px;margin-bottom:16px;display:none;font-size:13px;"></div>

  <!-- 原始JSON -->
  <div class="lm-panel">
    <div class="lm-panel__header"><span class="lm-panel__title">详细信息</span></div>
    <div class="lm-panel__body">
      <pre id="raw-json-content" style="background:var(--lm-color-bg-secondary);padding:12px;border-radius:8px;font-size:11px;overflow:auto;max-height:400px;white-space:pre-wrap;margin:0;">加载中…</pre>
    </div>
  </div>
</div>

<script>
let rawData = null;

function showMsg(text, type) {
  const el = document.getElementById('status-msg');
  el.textContent = text;
  el.style.display = 'block';
  el.style.background = type === 'error' ? 'var(--lm-color-danger-bg, #fee)' : 'var(--lm-color-bg-secondary)';
  el.style.color = type === 'error' ? 'var(--lm-color-danger, #c00)' : 'var(--lm-color-text)';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function renderStatus(data) {
  document.getElementById('status-login').textContent = data.logged_in ? '已登录' : '未登录';
  document.getElementById('status-login').style.color = data.logged_in ? 'var(--lm-color-success, #2a7)' : 'var(--lm-color-text-secondary)';
  document.getElementById('status-cookies').textContent = data.cookie_count || 0;
  document.getElementById('status-profile').textContent = data.has_profile ? '已获取' : '未获取';
  document.getElementById('status-lastcheck').textContent = data.last_check || data.last_login || '—';
  document.getElementById('raw-json-content').textContent = JSON.stringify(data, null, 2);
  if (data.message) showMsg(data.message, data.logged_in ? 'info' : 'error');
}

async function checkLogin() {
  try {
    const res = await LUMENIS.fetch('/api/weibo/login-status');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    rawData = data;
    renderStatus(data);
  } catch (e) {
    showMsg(`检查失败: ${e.message}`, 'error');
  }
}

async function startLogin() {
  try {
    const res = await LUMENIS.fetch('/api/weibo/start-login', {method: 'POST'});
    const data = await res.json();
    showMsg(data.message || '登录流程已启动，请在系统内浏览器完成扫码', 'info');
    setTimeout(checkLogin, 3000);
  } catch (e) {
    showMsg(`启动登录失败: ${e.message}`, 'error');
  }
}

async function clearLogin() {
  if (!confirm('确认清除微博登录状态？')) return;
  try {
    const res = await LUMENIS.fetch('/api/weibo/clear-login', {method: 'POST'});
    const data = await res.json();
    showMsg(data.message || '已清除登录状态', 'info');
    checkLogin();
  } catch (e) {
    showMsg(`清除失败: ${e.message}`, 'error');
  }
}

function toggleRaw() {
  const p = document.getElementById('raw-json-content').parentElement.parentElement;
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

// 等待 LUMENIS 初始化
function _waitForLUMENIS(cb) {
  if (window.LUMENIS && window.LUMENIS.fetch) cb();
  else setTimeout(() => _waitForLUMENIS(cb), 50);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => _waitForLUMENIS(checkLogin));
} else {
  _waitForLUMENIS(checkLogin);
}
</script>
{% endblock %}
