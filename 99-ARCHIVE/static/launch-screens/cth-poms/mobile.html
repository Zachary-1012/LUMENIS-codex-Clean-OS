<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>广州太古汇舆情监测系统 · CTH-POMS</title>
<style>
  /* 侘寂黑白灰启动封面 · 手机版（390/430 竖屏自适应）· 当前不接入系统 */
  :root{
    --bg:#FAFAF9; --surface:#FFFFFF; --stone-900:#1C1917; --stone-700:#44403C;
    --stone-500:#78716C; --stone-300:#D6D3D1; --stone-200:#E7E5E4;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--stone-900); -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;overflow:hidden;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  .bootline{position:fixed;top:0;left:0;height:1px;width:0;background:var(--stone-900);animation:boot 1.1s var(--ease) forwards}
  @keyframes boot{to{width:100%}}
  .stage{text-align:center;animation:rise .6s var(--ease) both;width:100%;max-width:340px}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .mark{width:32px;height:32px;margin:0 auto 22px;color:var(--stone-900)}
  .cn{font-size:25px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
  .en{margin-top:10px;font-size:11.5px;color:var(--stone-500);letter-spacing:.01em;line-height:1.65}
  .divider{width:34px;height:1px;background:var(--stone-300);margin:20px auto}
  .abbr{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.12em;color:var(--stone-700);
    border:1px solid var(--stone-200);border-radius:999px;padding:6px 13px;background:var(--surface)}
  .abbr .dot{width:6px;height:6px;border-radius:999px;background:var(--stone-900)}
  .sysfoot{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;
    font-size:10px;letter-spacing:.16em;color:var(--stone-500)}
  /* iOS 式居中密码登录：满宽贴底 sheet 与居中弹窗两种，这里用居中材质卡 */
  .mask{position:fixed;inset:0;background:rgba(28,25,23,.32);display:grid;place-items:center;
    opacity:0;pointer-events:none;transition:opacity .24s var(--ease);padding:20px}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{width:100%;max-width:360px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);border:1px solid var(--stone-200);border-radius:16px;
    padding:22px;box-shadow:0 24px 64px rgba(28,25,23,.22);transform:translateY(10px) scale(.99);
    transition:transform .3s var(--ease)}
  .mask.show .sheet{transform:none}
  .sheet h3{font-size:16px;font-weight:650;margin-bottom:4px}
  .sheet p{font-size:12.5px;color:var(--stone-500);line-height:1.6;margin-bottom:18px}
  .sheet input{width:100%;height:44px;border:1px solid var(--stone-300);border-radius:10px;padding:0 13px;
    font:inherit;font-size:15px;outline:none;background:#fff}
  .sheet input:focus{border-color:var(--stone-900)}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .btn{height:42px;flex:1;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--stone-900);color:#fff;border:1px solid var(--stone-900)}
  .btn.ghost{background:#fff;color:var(--stone-700);border:1px solid var(--stone-300)}
  .hint{margin-top:12px;font-size:11px;color:var(--stone-500);text-align:center}
</style>
</head>
<body>
  <div class="bootline"></div>
  <div class="stage">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 18h18"/><path d="M6 15V9"/><path d="M11 15V6"/><path d="M16 15v-4"/><path d="M20 15V11"/>
    </svg>
    <div class="cn">广州太古汇舆情监测系统</div>
    <div class="en">CorTech Lab · Guangzhou Taikoo Hui<br>Public Opinion Monitoring System</div>
    <div class="divider"></div>
    <span class="abbr"><span class="dot"></span>CTH-POMS</span>
  </div>
  <div class="sysfoot">Z-BRAND CORE</div>

  <div class="mask" id="loginMask" role="dialog" aria-modal="true">
    <div class="sheet">
      <h3>登录 CTH-POMS</h3>
      <p>广州太古汇舆情监测系统 · 请输入访问密码</p>
      <input type="password" id="pw" placeholder="访问密码" autocomplete="off">
      <div class="row">
        <button class="btn ghost" type="button" onclick="document.getElementById('loginMask').classList.remove('show')">取消</button>
        <button class="btn primary" type="button" onclick="alert('静态封面示意：正式接入后在此校验密码')">解锁进入</button>
      </div>
      <div class="hint">启动页为独立静态示意，当前未接入主系统</div>
    </div>
  </div>
<script>
  setTimeout(function(){ document.getElementById('loginMask').classList.add('show'); }, 1200);
</script>
</body>
</html>
