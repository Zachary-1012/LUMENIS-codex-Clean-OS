<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>智能研究学习中枢 · SICI 启动</title>
<link rel="stylesheet" href="launch-common.css">
</head>
<body>
  <!-- 启动海报 -->
  <div class="stage" id="stage">
    <div class="atmos" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span></div>
    <div class="grain" aria-hidden="true"></div>
    <button class="skip" id="skip" type="button">点击跳过</button>
    <div class="orbit" aria-hidden="true">
      <span class="fcard f1"><i class="dot d-info"></i>技术研究</span>
      <span class="fcard f2"><i class="dot "></i>案例学习</span>
      <span class="fcard f3"><i class="dot "></i>知识沉淀</span>
      <span class="fcard f4"><i class="dot "></i>基准评测</span>
      <span class="fcard f5"><i class="dot d-warn"></i>候选验证</span>
      <span class="fcard f6"><i class="dot d-ok"></i>能力进化</span>
    </div>
    <div class="hero">
      <div class="abbr">SICI</div>
      <div class="divider"></div>
      <div class="zh">智能研究学习中枢</div>
      <div class="en">Intelligent Research &amp; Learning Hub</div>
    </div>
    <div class="sysfoot">智能研究学习中枢 · Intelligent Research &amp; Learning Hub (SICI)</div>
  </div>

  <!-- 苹果风居中密码登录弹窗 -->
  <div class="login" id="login" role="dialog" aria-modal="true" aria-label="进入智能研究学习中枢">
    <form class="login-card" onsubmit="return false">
      <div class="login-mark">SICI</div>
      <div class="login-title">进入智能研究学习中枢</div>
      <div class="login-sub">Intelligent Research &amp; Learning Hub</div>
      <div class="field">
        <label>账号</label>
        <input id="accountInput" type="text" autocomplete="username" placeholder="请输入账号" value="Zachary">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="pwdInput" type="password" autocomplete="current-password" placeholder="请输入密码">
      </div>
      <div class="login-err" id="loginErr"></div>
      <button class="btn-login" id="btnLogin" type="button">进 入</button>
      <div class="login-hint">Intelligent Research &amp; Learning Hub · 安全登录</div>
    </form>
  </div>

  <!-- 登录后占位（接入真实系统时替换为跳转） -->
  <div class="after" id="after">
    <div class="big">SICI</div>
    <div class="small">已通过本地校验 · 接入真实系统时从此跳转（当前为独立预览，未启用）</div>
  </div>
  <script src="launch-common.js"></script>
</body>
</html>
