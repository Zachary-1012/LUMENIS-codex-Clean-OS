name: Verify Z-Brand-Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile Python sources
        # BLOCKING: syntax errors must fail verification.
        run: python scripts/check_python_syntax.py
      - name: Run pytest (non-browser subset)
        # BLOCKING: missing pytest, collection errors and test failures fail verification.
        timeout-minutes: 15
        run: |
          python -m pytest tests/ \
            -m "not online" \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_browser_e2e.py \
            --ignore=tests/test_browser_hybrid.py \
            --ignore=tests/test_browser_runtime_resident.py \
            --ignore=tests/test_browser_surface.py \
            --ignore=tests/test_browser_downloads.py \
            --ignore=tests/test_internal_browser_recovery.py \
            --ignore=tests/test_collector_e2e_four_layer.py \
            --ignore=tests/test_dual_domain_e2e.py \
            --ignore=tests/browser_runtime \
            -q --tb=line
      - name: Boundary Check (双库边界机器检查)
        # BLOCKING: --ci returns failure for CRITICAL/HIGH violations.
        run: |
          python scripts/audit_tools/boundary_check.py --ci
      - name: Asset Impact Scan (全库资产影响图)
        # ADVISORY: inventory generation is not a production acceptance gate.
        continue-on-error: true
        run: |
          python scripts/audit_tools/asset_impact_scan.py
