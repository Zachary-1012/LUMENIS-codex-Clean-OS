name: One-shot exact provider policy patch

on:
  push:
    branches: [chore/four-product-gates-v1]

permissions:
  contents: write

jobs:
  patch-and-self-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/four-product-gates-v1
          fetch-depth: 0

      - name: Exact preimage replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('intelligence.py')
          old = "PROVIDER_POLICY = 'ollama local primary when configured; cloud providers explicit-only; rule final fallback'"
          new = "PROVIDER_POLICY = 'ollama local primary when configured; zhipu and other cloud providers explicit-only; rule final fallback'"
          text = p.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'FAIL: expected exact preimage once, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          verify = p.read_text(encoding='utf-8')
          if verify.count(new) != 1 or old in verify:
              raise SystemExit('FAIL: postimage verification failed')
          print('PASS: exact provider-policy description updated')
          PY

      - name: Remove one-shot workflow and verify scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-provider-policy-patch.yml
          git add intelligence.py
          mapfile -t files < <(git diff --cached --name-only | sort)
          printf 'staged: %s\n' "${files[@]}"
          expected=(.github/workflows/one-shot-provider-policy-patch.yml intelligence.py)
          if [[ "${files[*]}" != "${expected[*]}" ]]; then
            echo "FAIL: unexpected staged scope"
            exit 1
          fi

      - name: Commit exact source clarification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(ai): clarify explicit cloud provider policy"
          git push origin HEAD:chore/four-product-gates-v1
