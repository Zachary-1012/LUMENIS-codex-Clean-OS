{% extends "base.html" %}
{% block title %}Brands · 序境 LUMENIS{% endblock %}
{% block page_title %}Brands{% endblock %}

{% block topbar_actions %}
<div style="display:flex;align-items:center;gap:12px;">
  <div class="zbc-search" style="position:relative;">
    <input type="text" class="zbc-search__input" id="brand-search" placeholder="搜索品牌…" aria-label="搜索品牌" style="padding-left:32px;width:200px;">
    <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--l-text-tertiary,#9CA3AF);font-size:14px;">⌕</span>
  </div>
  <select class="zbc-btn" id="industry-filter" aria-label="业态筛选" style="cursor:pointer;padding:6px 12px;">
    <option value="">全部业态</option>
  </select>
  <span class="zbc-tag zbc-tag--info" id="logo-coverage">Logo加载中…</span>
</div>
{% endblock %}

{% block content %}
<div class="lm-viewport" data-domain="cth">
  <!-- KPI -->
  <div class="zbc-kpi-grid" style="margin-bottom:16px;">
    <div class="zbc-kpi-card zbc-kpi-card--gradient-cth">
      <div class="zbc-kpi-card__label">场内品牌</div>
      <div class="zbc-kpi-card__value" data-kpi id="kpi-total">—</div>
    </div>
    <div class="zbc-kpi-card">
      <div class="zbc-kpi-card__label">业态分类</div>
      <div class="zbc-kpi-card__value" data-kpi id="kpi-categories">—</div>
    </div>
    <div class="zbc-kpi-card">
      <div class="zbc-kpi-card__label">Logo覆盖</div>
      <div class="zbc-kpi-card__value" data-kpi id="kpi-logo">—</div>
    </div>
    <div class="zbc-kpi-card">
      <div class="zbc-kpi-card__label">楼层</div>
      <div class="zbc-kpi-card__value" data-kpi id="kpi-floors">—</div>
    </div>
  </div>

  <!-- 品牌卡片网格 -->
  <div class="zbc-card" style="margin-bottom:16px;">
    <div class="zbc-card__header">
      <span class="zbc-card__title">品牌目录</span>
      <span class="zbc-tag zbc-tag--info" id="brand-count">0 个品牌</span>
    </div>
    <div class="zbc-card__body" style="padding:16px;">
      <div class="zbc-state-loading" id="brand-loading">
        <div class="zbc-skeleton" style="width:60%;height:20px;margin:0 auto 16px;"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;">
          <div class="zbc-skeleton" style="height:120px;border-radius:12px;"></div>
          <div class="zbc-skeleton" style="height:120px;border-radius:12px;"></div>
          <div class="zbc-skeleton" style="height:120px;border-radius:12px;"></div>
          <div class="zbc-skeleton" style="height:120px;border-radius:12px;"></div>
          <div class="zbc-skeleton" style="height:120px;border-radius:12px;"></div>
          <div class="zbc-skeleton" style="height:120px;border-radius:12px;"></div>
        </div>
      </div>
      <div class="zbc-state-empty" id="brand-empty" style="display:none;">
        <div class="zbc-state-empty__icon">📭</div>
        <div class="zbc-state-empty__text">暂无品牌数据</div>
        <button class="zbc-btn zbc-btn--primary" onclick="loadBrands()" type="button">刷新</button>
      </div>
      <div id="brand-grid" style="display:none;"></div>
    </div>
    <div class="zbc-card__body" id="brand-pagination" style="display:none;padding:12px 20px;border-top:1px solid var(--l-border-light,#F0F0F0);justify-content:space-between;align-items:center;">
      <span style="font-size:12px;color:var(--l-text-secondary,#6B7280);" id="page-info">共 0 条</span>
      <div style="display:flex;gap:8px;">
        <button class="zbc-btn" id="prev-page" type="button" style="padding:4px 12px;">上一页</button>
        <button class="zbc-btn" id="next-page" type="button" style="padding:4px 12px;">下一页</button>
      </div>
    </div>
  </div>
</div>

<script>
var allBrands = [];
var currentPage = 1;
var perPage = 48;

function loadBrands() {
  document.getElementById('brand-loading').style.display = '';
  document.getElementById('brand-empty').style.display = 'none';
  document.getElementById('brand-grid').style.display = 'none';
  document.getElementById('brand-pagination').style.display = 'none';

  fetch('/api/brands/logos', { headers: { 'X-Domain-Id': 'cth' } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) throw new Error(d.error || '加载失败');
      allBrands = d.brands || [];
      var stats = d.logo_stats || {};
      var categories = d.categories || [];

      document.getElementById('kpi-total').textContent = stats.total || allBrands.length;
      document.getElementById('kpi-categories').textContent = categories.length;
      document.getElementById('kpi-logo').textContent = (stats.coverage || 0) + '%';
      var floors = new Set(allBrands.map(function(b){ return b.floor; }).filter(Boolean));
      document.getElementById('kpi-floors').textContent = floors.size;
      document.getElementById('logo-coverage').textContent = 'Logo ' + (stats.coverage || 0) + '%';

      var sel = document.getElementById('industry-filter');
      categories.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        sel.appendChild(opt);
      });

      document.getElementById('brand-loading').style.display = 'none';
      if (allBrands.length === 0) {
        document.getElementById('brand-empty').style.display = '';
      } else {
        currentPage = 1;
        renderBrands();
      }
    })
    .catch(function(e) {
      document.getElementById('brand-loading').style.display = 'none';
      document.getElementById('brand-empty').style.display = '';
      document.querySelector('#brand-empty .zbc-state-empty__text').textContent = '加载失败: ' + e.message;
    });
}

function getFilteredBrands() {
  var kw = document.getElementById('brand-search').value.toLowerCase();
  var cat = document.getElementById('industry-filter').value;
  return allBrands.filter(function(b) {
    var matchKw = !kw || (b.brand_en || '').toLowerCase().indexOf(kw) >= 0 || (b.brand_cn || '').toLowerCase().indexOf(kw) >= 0;
    var matchCat = !cat || b.category === cat;
    return matchKw && matchCat;
  });
}

function renderBrands() {
  var filtered = getFilteredBrands();
  var total = filtered.length;
  var totalPages = Math.ceil(total / perPage);
  if (currentPage > totalPages) currentPage = totalPages || 1;
  var start = (currentPage - 1) * perPage;
  var pageBrands = filtered.slice(start, start + perPage);

  document.getElementById('brand-count').textContent = total + ' 个品牌';
  document.getElementById('page-info').textContent = '共 ' + total + ' 条，第 ' + currentPage + '/' + totalPages + ' 页';

  var html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;">';
  pageBrands.forEach(function(b) {
    var initial = (b.brand_en || '?').charAt(0).toUpperCase();
    var logoHtml = b.has_logo && b.logo
      ? '<img src="' + b.logo + '" alt="' + (b.brand_en || '') + '" style="width:100%;height:100%;object-fit:contain;" onerror="this.parentElement.innerHTML=\'<div style=\\\'font-size:20px;font-weight:700;color:var(--l-text-tertiary,#9CA3AF);\\\'>' + initial + '</div>\'">'
      : '<div style="font-size:20px;font-weight:700;color:var(--l-text-tertiary,#9CA3AF);">' + initial + '</div>';
    var cn = b.brand_cn ? '<div style="font-size:11px;color:var(--l-text-secondary,#6B7280);margin-bottom:6px;">' + b.brand_cn + '</div>' : '';
    var catShort = (b.category || '').split(' ')[0];
    html += '<div class="zbc-card" style="padding:16px;text-align:center;cursor:pointer;transition:all 0.2s ease;" '
      + 'onmouseover="this.style.transform=\'translateY(-2px)\';this.style.boxShadow=\'0 8px 24px rgba(0,0,0,0.08)\'" '
      + 'onmouseout="this.style.transform=\'\';this.style.boxShadow=\'\'" '
      + 'title="' + (b.brand_en || '') + ' ' + (b.shop || '') + '">'
      + '<div style="width:56px;height:56px;margin:0 auto 10px;border-radius:12px;background:var(--l-bg-secondary,#F7F7F8);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--l-border-light,#F0F0F0);">' + logoHtml + '</div>'
      + '<div style="font-size:13px;font-weight:600;color:var(--l-text,#0D0D0D);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (b.brand_en || '') + '</div>'
      + cn
      + '<div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;">'
      + (b.floor ? '<span class="zbc-tag" style="font-size:10px;padding:2px 6px;background:rgba(0,212,170,0.1);color:#0d9488;font-weight:600;">' + b.floor + '</span>' : '')
      + (catShort ? '<span class="zbc-tag" style="font-size:10px;padding:2px 6px;">' + catShort + '</span>' : '')
      + '</div></div>';
  });
  html += '</div>';
  document.getElementById('brand-grid').innerHTML = html;
  document.getElementById('brand-grid').style.display = '';
  document.getElementById('brand-pagination').style.display = total > perPage ? 'flex' : 'none';
  document.getElementById('prev-page').disabled = currentPage <= 1;
  document.getElementById('next-page').disabled = currentPage >= totalPages;
}

document.getElementById('brand-search').addEventListener('input', function() { currentPage = 1; renderBrands(); });
document.getElementById('industry-filter').addEventListener('change', function() { currentPage = 1; renderBrands(); });
document.getElementById('prev-page').addEventListener('click', function() { if (currentPage > 1) { currentPage--; renderBrands(); } });
document.getElementById('next-page').addEventListener('click', function() { currentPage++; renderBrands(); });

document.addEventListener('DOMContentLoaded', loadBrands);
</script>
{% endblock %}
