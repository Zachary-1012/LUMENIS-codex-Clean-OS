              if not isinstance(address, tuple) or address[0] != '127.0.0.1' or address[1] not in owned_ports:
                  return denied()
              return original_connect(sock, address)
          socket.socket.bind, socket.socket.connect = bind, connect
          socket.socket.connect_ex = socket.socket.sendto = denied
          import pytest
          raise SystemExit(pytest.main(['-vv', '--tb=short', '-p', 'no:cacheprovider',
              '--junitxml=' + os.path.join(os.environ['RUNNER_TEMP'], 'oevira-http.xml'),
