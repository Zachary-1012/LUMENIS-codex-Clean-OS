{% extends "base.html" %}
{% block title %}话题监测 · 序境 LUMENIS{% endblock %}
{% block page_title %}话题监测{% endblock %}
{% block active_nav %}cth_topics{% endblock %}

{% block content %}
<style>
.topic-hero { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; }
.topic-card { background:var(--lm-surface,#fff); border:1px solid var(--lm-border,#e5e7eb); border-radius:16px; padding:18px 20px; }
.topic-card__label { font-size:11px; font-weight:600; color:var(--lm-text-secondary,#6b7280); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
.topic-card__value { font-size:26px; font-weight:700; color:var(--lm-text,#111827); }
.topic-card__sub { font-size:11px; color:var(--lm-text-tertiary,#9ca3af); margin-top:4px; }
.topic-section { background:var(--lm-surface,#fff); border:1px solid var(--lm-border,#e5e7eb); border-radius:16px; padding:20px; margin-bottom:18px; }
.topic-section__title { font-size:15px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.topic-list { display:grid; gap:10px; }
.topic-item { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--lm-bg,#f9fafb); border-radius:12px; }
.topic-item__name { font-weight:600; font-size:14px; }
.topic-item__stats { display:flex; gap:18px; font-size:12px; color:var(--lm-text-secondary,#6b7280); }
.topic-item__stats strong { color:var(--lm-text,#111827); font-weight:700; }
.notes-table { width:100%; border-collapse:collapse; font-size:13px; }
.notes-table th { text-align:left; padding:10px 12px; border-bottom:2px solid var(--lm-border,#e5e7eb); font-size:11px; font-weight:700; color:var(--lm-text-secondary,#6b7280); text-transform:uppercase; }
.notes-table td { padding:10px 12px; border-bottom:1px solid var(--lm-border,#f3f4f6); }
.notes-table tr:hover { background:var(--lm-bg,#f9fafb); }
.notes-title { max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
.engagement { display:flex; gap:10px; font-size:11px; color:var(--lm-text-secondary,#6b7280); }
.timeline-chart { height:200px; width:100%; }
.toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.toolbar select, .toolbar input { padding:8px 12px; border:1px solid var(--lm-border,#d1d5db); border-radius:10px; font-size:13px; background:var(--lm-surface,#fff); }
.btn { padding:8px 16px; border-radius:10px; border:none; font-size:13px; font-weight:600; cursor:pointer; }
.btn--primary { background:var(--lm-primary,#00d4aa); color:#fff; }
.btn--ghost { background:transparent; border:1px solid var(--lm-border,#d1d5db); color:var(--lm-text-secondary,#6b7280); }
.status-badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.status-badge--active { background:rgba(0,212,170,0.12); color:#0d9488; }
.status-badge--inactive { background:rgba(156,163,175,0.15); color:#6b7280; }
</style>

<div class="topic-hero" id="topic-kpis">
  <div class="topic-card"><div class="topic-card__label">活动状态</div><div class="topic-card__value" id="kpi-status">—</div><div class="topic-card__sub" id="kpi-campaign">—</div></div>
  <div class="topic-card"><div class="topic-card__label">唯一笔记</div><div class="topic-card__value" id="kpi-unique">—</div><div class="topic-card__sub">去重后总数</div></div>
  <div class="topic-card"><div class="topic-card__label">24h新增</div><div class="topic-card__value" id="kpi-new">—</div><div class="topic-card__sub">最近24小时</div></div>
  <div class="topic-card"><div class="topic-card__label">采集次数</div><div class="topic-card__value" id="kpi-runs">—</div><div class="topic-card__sub">成功快照数</div></div>
  <div class="topic-card"><div class="topic-card__label">话题数</div><div class="topic-card__value" id="kpi-topics">—</div><div class="topic-card__sub">监测话题</div></div>
</div>

<div class="topic-section">
  <div class="topic-section__title">话题分布</div>
  <div class="topic-list" id="topic-list"></div>
</div>

<div class="topic-section">
  <div class="topic-section__title">采集时间线</div>
  <div class="timeline-chart" id="timeline-chart"></div>
</div>

<div class="topic-section">
  <div class="topic-section__title">笔记列表</div>
  <div class="toolbar">
    <select id="filter-topic"><option value="">全部话题</option></select>
    <input type="text" id="search-notes" placeholder="搜索笔记标题/作者..." style="flex:1;min-width:200px;">
    <button class="btn btn--ghost" onclick="TC.exportCSV()">导出CSV</button>
    <button class="btn btn--primary" onclick="TC.refresh()">刷新</button>
  </div>
  <div style="overflow-x:auto;">
    <table class="notes-table">
      <thead><tr><th>话题</th><th>标题</th><th>作者</th><th>发布时间</th><th>互动</th><th>链接</th></tr></thead>
      <tbody id="notes-tbody"></tbody>
    </table>
  </div>
  <div id="notes-pagination" style="margin-top:14px; display:flex; gap:8px; align-items:center; font-size:13px;"></div>
</div>

<script>
var TC = {
  state: { notes: [], topics: [], stats: null, timeline: [], page: 1, perPage: 20, filterTopic: '', search: '' },
  init: function() {
    var self = this;
    document.getElementById('filter-topic').addEventListener('change', function() { self.state.filterTopic = this.value; self.state.page = 1; self.renderNotes(); });
    document.getElementById('search-notes').addEventListener('input', function() { self.state.search = this.value.trim(); self.state.page = 1; self.renderNotes(); });
    this.loadAll();
  },
  loadAll: function() {
    var self = this;
    xjViz.api('/topic-campaign/stats').then(function(d) {
      if (d.ok) { self.state.stats = d; self.renderKPIs(d); self.renderTopics(d.by_topic || []); }
    });
    xjViz.api('/topic-campaign/topics').then(function(d) {
      if (d.ok) {
        self.state.topics = d.topics || [];
        var sel = document.getElementById('filter-topic');
        (d.topics || []).forEach(function(t) {
          var opt = document.createElement('option'); opt.value = t.topic || t.name; opt.textContent = t.topic || t.name; sel.appendChild(opt);
        });
      }
    });
    xjViz.api('/topic-campaign/timeline').then(function(d) {
      if (d.ok) { self.state.timeline = d.snapshots || []; self.renderTimeline(); }
    });
    xjViz.api('/topic-campaign/notes?limit=200').then(function(d) {
      if (d.ok) { self.state.notes = d.notes || []; self.renderNotes(); }
    });
  },
  renderKPIs: function(d) {
    var t = d.total || {};
    document.getElementById('kpi-unique').textContent = t.unique_notes || 0;
    document.getElementById('kpi-new').textContent = t.new_notes_24h || 0;
    document.getElementById('kpi-runs').textContent = t.runs || 0;
    document.getElementById('kpi-topics').textContent = (d.by_topic || []).length;
    var c = d.campaign || {};
    document.getElementById('kpi-status').innerHTML = '<span class="status-badge status-badge--active">监测中</span>';
    document.getElementById('kpi-campaign').textContent = d.campaign_key || '';
  },
  renderTopics: function(topics) {
    var html = '';
    topics.forEach(function(t) {
      html += '<div class="topic-item"><div class="topic-item__name">' + (t.topic || '') + '</div>' +
        '<div class="topic-item__stats"><span>笔记 <strong>' + (t.unique_notes || 0) + '</strong></span>' +
        '<span>24h <strong>' + (t.new_notes || 0) + '</strong></span>' +
        '<span>运行 <strong>' + (t.runs || 0) + '</strong></span></div></div>';
    });
    document.getElementById('topic-list').innerHTML = html || '<div style="color:#9ca3af;font-size:13px;">暂无话题数据</div>';
  },
  renderTimeline: function() {
    var snaps = this.state.timeline || [];
    if (snaps.length === 0) { document.getElementById('timeline-chart').innerHTML = '<div style="color:#9ca3af;text-align:center;padding:60px;">暂无时间线数据</div>'; return; }
    // 按日期聚合
    var byDate = {};
    snaps.forEach(function(s) {
      var d = (s.snapshot_at || s.created_at || '').slice(0, 10);
      if (!d) return;
      byDate[d] = (byDate[d] || 0) + 1;
    });
    var dates = Object.keys(byDate).sort();
    var values = dates.map(function(d) { return byDate[d]; });
    // 简单SVG柱状图
    var max = Math.max.apply(null, values.concat([1]));
    var w = document.getElementById('timeline-chart').offsetWidth || 600;
    var h = 180, barW = Math.max(4, w / dates.length - 4);
    var svg = '<svg width="100%" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">';
    dates.forEach(function(d, i) {
      var bh = (values[i] / max) * (h - 30);
      var x = i * (barW + 4) + 10;
      svg += '<rect x="' + x + '" y="' + (h - bh - 20) + '" width="' + barW + '" height="' + bh + '" rx="3" fill="#00d4aa" opacity="0.75"><title>' + d + ': ' + values[i] + '次</title></rect>';
      if (dates.length <= 15) svg += '<text x="' + (x + barW/2) + '" y="' + (h - 5) + '" font-size="9" fill="#9ca3af" text-anchor="middle">' + d.slice(5) + '</text>';
    });
    svg += '</svg>';
    document.getElementById('timeline-chart').innerHTML = svg;
  },
  renderNotes: function() {
    var self = this;
    var filtered = this.state.notes.filter(function(n) {
      if (self.state.filterTopic && n.topic !== self.state.filterTopic) return false;
      if (self.state.search) {
        var s = self.state.search.toLowerCase();
        return (n.title || '').toLowerCase().indexOf(s) >= 0 || (n.author || '').toLowerCase().indexOf(s) >= 0;
      }
      return true;
    });
    var total = filtered.length;
    var pages = Math.max(1, Math.ceil(total / this.state.perPage));
    if (this.state.page > pages) this.state.page = pages;
    var start = (this.state.page - 1) * this.state.perPage;
    var pageNotes = filtered.slice(start, start + this.state.perPage);
    var html = '';
    pageNotes.forEach(function(n) {
      var eng = (n.likes||0) + (n.comments||0) + (n.collects||0) + (n.shares||0);
      html += '<tr><td style="font-size:11px;color:#0d9488;font-weight:600;">' + (n.topic || '—') + '</td>' +
        '<td class="notes-title">' + (n.title || '无标题') + '</td>' +
        '<td>' + (n.author || '—') + '</td>' +
        '<td style="font-size:12px;color:#6b7280;">' + (n.publish_datetime || '—').slice(0, 16) + '</td>' +
        '<td><div class="engagement"><span>❤' + (n.likes||0) + '</span><span>💬' + (n.comments||0) + '</span><span>⭐' + (n.collects||0) + '</span><span>↗' + (n.shares||0) + '</span></div></td>' +
        '<td>' + (n.note_url ? '<a href="' + n.note_url + '" target="_blank" style="color:#0d9488;font-size:12px;">查看</a>' : '—') + '</td></tr>';
    });
    document.getElementById('notes-tbody').innerHTML = html || '<tr><td colspan="6" style="text-align:center;padding:30px;color:#9ca3af;">暂无笔记数据</td></tr>';
    // 分页
    var pag = '<span>共 ' + total + ' 条</span>';
    if (pages > 1) {
      pag += '<button class="btn btn--ghost" style="padding:4px 10px;" onclick="TC.prevPage()" ' + (this.state.page <= 1 ? 'disabled' : '') + '>上一页</button>';
      pag += '<span>' + this.state.page + ' / ' + pages + '</span>';
      pag += '<button class="btn btn--ghost" style="padding:4px 10px;" onclick="TC.nextPage()" ' + (this.state.page >= pages ? 'disabled' : '') + '>下一页</button>';
    }
    document.getElementById('notes-pagination').innerHTML = pag;
  },
  prevPage: function() { if (this.state.page > 1) { this.state.page--; this.renderNotes(); } },
  nextPage: function() { this.state.page++; this.renderNotes(); },
  refresh: function() { this.loadAll(); },
  exportCSV: function() { window.location.href = '/api/topic-campaign/export'; }
};
document.addEventListener('DOMContentLoaded', function() { TC.init(); });
</script>
{% endblock %}
