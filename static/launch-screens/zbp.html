<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>品牌业务生产平台 · ZBP 启动</title>
<link rel="stylesheet" href="launch-common.css">
</head>
<body>
  <!-- 启动海报 -->
  <div class="stage" id="stage">
    <div class="atmos" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span></div>
    <div class="grain" aria-hidden="true"></div>
    <button class="skip" id="skip" type="button">点击跳过</button>
    <div class="orbit" aria-hidden="true">
      <span class="fcard f1"><i class="dot d-info"></i>生产交付</span>
      <span class="fcard f2"><i class="dot "></i>能力编排</span>
      <span class="fcard f3"><i class="dot "></i>统一治理</span>
      <span class="fcard f4"><i class="dot "></i>运行监控</span>
      <span class="fcard f5"><i class="dot d-warn"></i>质量门禁</span>
      <span class="fcard f6"><i class="dot d-ok"></i>产品矩阵</span>
    </div>
    <div class="hero">
      <div class="abbr">ZBP</div>
      <div class="divider"></div>
      <div class="zh">品牌业务生产平台</div>
      <div class="en">Z-Brand Business Production Platform</div>
    </div>
    <div class="sysfoot">Z-Brand Intelligence Platform · 品牌业务生产平台 ZBP</div>
  </div>

  <!-- 苹果风居中密码登录弹窗 -->
  <div class="login" id="login" role="dialog" aria-modal="true" aria-label="进入品牌业务生产平台">
    <form class="login-card" onsubmit="return false">
      <div class="login-mark">ZBP</div>
      <div class="login-title">进入品牌业务生产平台</div>
      <div class="login-sub">Z-Brand Business Production Platform</div>
      <div class="field">
        <label>账号</label>
        <input id="accountInput" type="text" autocomplete="username" placeholder="请输入账号" value="Zachary">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="pwdInput" type="password" autocomplete="current-password" placeholder="请输入密码">
      </div>
      <div class="login-err" id="loginErr"></div>
      <button class="btn-login" id="btnLogin" type="button">进 入</button>
      <div class="login-hint">Z-Brand Business Production Platform · 安全登录</div>
    </form>
  </div>

  <!-- 登录后占位（接入真实系统时替换为跳转） -->
  <div class="after" id="after">
    <div class="big">ZBP</div>
    <div class="small">已通过本地校验 · 接入真实系统时从此跳转（当前为独立预览，未启用）</div>
  </div>
  <script src="launch-common.js"></script>
</body>
</html>
